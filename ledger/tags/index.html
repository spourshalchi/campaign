<!DOCTYPE html>
<!--
  PROP: The crate tags from Orlok's cellar — six manila shipping tags in his hand, one per straw crate.
  The party matches them against the ledger (/ledger/) and finds the doe, No. 1190, has no crate.
  🟡 NOT CANON — invented with the ledger (3 Nov), logged in CANON.md. The fox and the owl are Sesh 8.
  PRINT: US Letter, portrait, 100%, cardstock. Built into print/1-cardstock.pdf. Cut on the dashed lines;
  a loop of string through each hole if you have it.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crate Tags">
<meta name="theme-color" content="#140f0a">
<title>Crate Tags — Dood Mansion cellar</title>
<style>
  :root{
    --manila:#e4c98f; --ink:#2a1a10; --ink2:#5a3a22; --cut:#8a7a62;
    --f-hand:"Snell Roundhand","Apple Chancery","Zapfino",cursive;
    --f-fig:"Hoefler Text","Baskerville",Georgia,serif;
    --f-print:"Copperplate","Hoefler Text",Georgia,serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(ellipse at 50% 8%, #3a2a18 0%, #1a120b 55%, #0b0806 100%) fixed;
    color:var(--ink); min-height:100dvh; overscroll-behavior:none;
    padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; gap:16px;
  }
  .bar{width:100%; max-width:760px; display:flex; justify-content:space-between; align-items:center; gap:10px;
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:#cdbd9f;
    -webkit-user-select:none; user-select:none}
  .bar a{font-weight:600; min-height:44px; padding:0 16px; border-radius:9px; border:1px solid #5a4430;
    background:#241a11; color:#e9dcc2; display:inline-flex; align-items:center; text-decoration:none; flex:none}

  .page{width:100%; max-width:760px; aspect-ratio:8.5/11; container-type:inline-size; background:#fbf8f1;
    box-shadow:0 24px 50px rgba(0,0,0,.75); position:relative}
  .grid{position:absolute; inset:4% 5%; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr);
    gap:0; outline:.2cqi dashed var(--cut); outline-offset:0}
  .cell{border:.2cqi dashed var(--cut); margin:-.1cqi; display:flex; align-items:center; justify-content:center; padding:2.2cqi 2cqi}

  /* a manila shipping tag: clipped top corners, a reinforced hole */
  .tag{width:100%; height:100%; position:relative;
    clip-path:polygon(16% 0, 84% 0, 100% 9%, 100% 100%, 0 100%, 0 9%);
    background-color:var(--manila);
    background-image:
      radial-gradient(ellipse at 50% 60%, transparent 50%, rgba(120,80,30,.25) 100%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .25  0 0 0 0 .1  0 0 0 .2 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    display:flex; flex-direction:column; align-items:center; text-align:center; padding:10.5cqi 2.2cqi 2.6cqi;
    -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .tag::before{content:""; position:absolute; top:3.2cqi; left:50%; width:4.6cqi; height:4.6cqi; margin-left:-2.3cqi; border-radius:50%;
    background:#fbf8f1; box-shadow:0 0 0 1.3cqi #cfae6c, 0 0 0 1.45cqi rgba(90,60,25,.35)}
  .tag .stat{font-family:var(--f-print); font-size:1.45cqi; letter-spacing:.16em; color:#7a5a32; border-bottom:.15cqi solid #9d7d4c; padding-bottom:.6cqi; width:100%}
  .tag .no{font-family:var(--f-fig); font-style:italic; font-size:6cqi; line-height:1; margin:2.6cqi 0 1.2cqi}
  .tag .no small{font-size:.5em; font-style:normal; font-family:var(--f-print); letter-spacing:.1em; margin-right:.4em}
  .tag .who{font-family:var(--f-hand); font-size:4.3cqi; line-height:1.1}
  .tag .what{font-family:var(--f-hand); font-size:3.4cqi; line-height:1.25; color:var(--ink2); margin-top:2.4cqi; flex:1}
  .tag .cd{font-family:var(--f-hand); font-size:2.8cqi; color:var(--ink2); align-self:flex-end}

  @media print{
    @page{size:letter portrait; margin:0}
    html,body{background:#fff !important}
    body{padding:0; display:block; min-height:0}
    .bar{display:none !important}
    .page{width:8.5in; height:11in; max-width:none; aspect-ratio:auto; box-shadow:none; background:#fff}
  }
</style>
</head>
<body>
<div class="bar">
  <span>🟡 Not canon yet &middot; six tags, one per crate. Cut on the dashes.</span>
  <a href="../">&larr; Ledger</a>
</div>
<div class="page">
  <div class="grid" id="grid"></div>
</div>
<script>
  // One tag per straw crate. The doe (1190) has none: that's the puzzle. Keep in step with /ledger/.
  var TAGS = [
    {no:1183, who:"Grey squirrel", what:"Tail. Dressed."},
    {no:1185, who:"Red fox, vixen", what:"R. foreleg, splint. Mind your fingers."},
    {no:1186, who:"Raccoon", what:"Both forepaws, burns. Salve twice nightly."},
    {no:1187, who:"Barn owl", what:"L. wing, bound. Keep hooded in lamplight."},
    {no:1188, who:"Crow", what:"Shoulder, shot drawn. Mind your fingers."},
    {no:1189, who:"Opossum & six", what:"Hind leg. Do not disturb the young."}
  ];
  document.getElementById('grid').innerHTML = TAGS.map(function(t){
    return '<div class="cell"><div class="tag">' +
      '<div class="stat">Patient</div>' +
      '<div class="no"><small>No.</small>' + t.no + '</div>' +
      '<div class="who">' + t.who.replace('&','&amp;') + '</div>' +
      '<div class="what">' + t.what + '</div>' +
      '<div class="cd">C. D.</div></div></div>';
  }).join('');
  document.addEventListener('touchmove', function(e){ if(e.scale && e.scale !== 1) e.preventDefault(); }, {passive:false});
</script>
</body>
</html>
