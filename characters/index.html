<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Characters">
<meta name="theme-color" content="#d9c48f">
<title>Make Your Character</title>
<style>
  /* a manila school folder: paper, typewriter labels, one accent per character */
  :root{
    --paper:#fbf6e6; --manila:#d9c48f; --ink:#1f1a12; --mut:#5b5140; --line:#b9ab86; --soft:#f1e8cc;
    --accent:#7a2d1f; --f-type:"Courier New",Courier,ui-monospace,monospace;
    --f-body:Georgia,"Times New Roman",serif; --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--manila);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
    min-height:100dvh;overscroll-behavior:none;
    padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
  #app{max-width:900px;margin:0 auto}
  .head{padding:6px 4px 12px}
  .kick{font:700 12px/1.3 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:#4a3f26}
  h1{margin:2px 0 0;font:700 clamp(28px,6vw,42px)/1.1 var(--f-type);color:var(--ink)}
  .sub{margin:4px 0 0;font-size:16px;color:#3a321f}
  .nav{padding:2px 0 4px}
  .backlink{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1px solid #6b5a30;border-radius:8px;background:var(--soft);color:var(--ink);font:700 15px var(--f-ui);text-decoration:none}
  .who{display:grid;gap:10px;margin-top:6px}
  .who a{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:64px;padding:10px 16px;border:1.5px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);text-decoration:none}
  .who b{font:700 21px/1.2 var(--f-type)}
  .who span{font:15px var(--f-ui);color:var(--mut)}
  .paper{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:0 8px 22px rgba(60,45,10,.25)}
  h2{margin:0 0 10px;font:700 24px/1.2 var(--f-type);color:var(--accent)}
  h3{margin:18px 0 6px;padding-bottom:3px;border-bottom:2px solid var(--line);font:700 15px/1.3 var(--f-ui);letter-spacing:.06em;text-transform:uppercase}
  p{margin:0 0 10px}
  ul{margin:0 0 10px;padding-left:20px}
  li{margin-bottom:4px}
  .why{color:var(--mut);font-size:15px}
  .rec{display:inline-block;padding:0 6px;border:1px solid var(--accent);border-radius:4px;color:var(--accent);font:700 11px/1.6 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
  .note{padding:10px 12px;margin:0 0 12px;background:var(--soft);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;font-size:15.5px}
  .step{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px dashed var(--line)}
  .step:first-of-type{border-top:0}
  .step .lab{font:700 13px/1.35 var(--f-ui);color:var(--accent)}
  .step b{font-weight:700}
  .foot{margin:14px 4px 0;font:13px/1.45 var(--f-ui);color:#3a321f}
  @media(max-width:560px){
    .paper{padding:12px}
    .step{grid-template-columns:1fr;gap:2px}
  }
  @media print{
    @page{size:letter portrait;margin:.45in}
    body{background:#fff;padding:0;font-size:12pt}
    .paper{border:0;box-shadow:none;padding:0;background:#fff}
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="engine.js?v=11"></script>
</body>
</html>
