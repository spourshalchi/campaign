<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Campaign">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a246a">
<title>Campaign — Programs</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top);
    --safe-bot: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: Tahoma, Geneva, "MS Sans Serif", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    background:
      repeating-linear-gradient(45deg, rgba(0,0,0,0.04) 0 2px, transparent 2px 6px),
      #008080;
  }
  body {
    height: 100dvh;
    padding: max(8px, var(--safe-top)) max(8px, env(safe-area-inset-right)) max(8px, var(--safe-bot)) max(8px, env(safe-area-inset-left));
    display: flex; align-items: center; justify-content: center;
  }
  .window {
    width: 100%; max-width: 720px;
    max-height: 100%;
    display: flex; flex-direction: column;
    background: #ece9d8;
    border: 2px outset #d4d0c8;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.25);
  }
  .titlebar {
    background: linear-gradient(180deg, #0a64bd 0%, #0a246a 100%);
    color: white;
    padding: 6px 8px;
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: bold;
    flex: 0 0 auto;
  }
  .titlebar .icon {
    width: 16px; height: 16px;
    background: #ffcc00;
    border-radius: 50%;
    box-shadow: inset -2px -2px 0 rgba(0,0,0,0.2);
    flex-shrink: 0;
  }
  .titlebar .title-text {
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .titlebar .winbtns { display: flex; gap: 2px; }
  .titlebar .winbtn {
    width: 22px; height: 20px;
    background: #d4d0c8;
    border: 1px outset #fff;
    color: black;
    font-size: 11px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    line-height: 1;
  }
  .menubar {
    background: #ece9d8;
    padding: 2px 4px;
    font-size: 13px; color: #222;
    display: flex; gap: 14px;
    border-bottom: 1px solid #aca899;
    flex: 0 0 auto;
  }
  .menubar span { padding: 1px 4px; }
  .menubar u { text-decoration: underline; }
  .body {
    padding: 14px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    flex: 1 1 auto;
    background: #ece9d8;
  }
  .greeting {
    font-size: 16px;
    color: #333;
    margin: 0 0 14px;
    padding: 8px 12px;
    background: #fffce0;
    border: 1px solid #d4cc88;
    line-height: 1.4;
  }
  .greeting b { color: #b22222; }

  /* Numbered programs, in the order the story reaches them.
     The DM's Run of Show says "iPad → item N"; the number is the whole interface. */
  .list {
    display: flex; flex-direction: column;
    gap: 10px;
    margin: 0; padding: 0; list-style: none;
  }
  .tile {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 10px 18px 10px 10px;
    background: linear-gradient(180deg, #ffffff 0%, #ece9d8 100%);
    border: 2px outset #d4d0c8;
    text-decoration: none;
    color: #111;
    min-height: clamp(84px, 13dvh, 120px);
    cursor: pointer;
  }
  .tile:active {
    border-style: inset;
    background: linear-gradient(180deg, #ece9d8 0%, #ffffff 100%);
  }
  .tile .num {
    flex: 0 0 auto;
    width: clamp(68px, 11dvh, 100px);
    align-self: stretch;
    min-height: 64px;
    background: linear-gradient(180deg, #fffce0 0%, #ffcc00 100%);
    border: 2px outset #fff5b0;
    display: flex; align-items: center; justify-content: center;
    font-family: Tahoma, Geneva, sans-serif;
    font-weight: bold;
    font-size: clamp(48px, 9dvh, 80px);
    line-height: 1;
    color: #3a2400;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
  }
  .tile .name {
    flex: 1; min-width: 0;
    font-weight: bold;
    font-size: clamp(24px, 4.2vw, 34px);
    color: #00008b;
    margin: 0;
    line-height: 1.15;
  }
  .tile .open {
    flex: 0 0 auto;
    font-size: 14px;
    color: #333;
    padding: 8px 14px;
    background: #d4d0c8;
    border: 2px outset #fff;
  }
  .tile:active .open { border-style: inset; }
  @media (max-width: 420px) {
    .tile .open { display: none; }
  }
  .statusbar {
    background: #ece9d8;
    padding: 4px 8px;
    border-top: 1px solid #aca899;
    font-size: 12px;
    color: #555;
    display: flex; justify-content: space-between;
    flex: 0 0 auto;
  }
</style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <span class="icon"></span>
      <span class="title-text">Programs — Connection Established</span>
      <span class="winbtns">
        <span class="winbtn">_</span>
        <span class="winbtn">▢</span>
        <span class="winbtn">×</span>
      </span>
    </div>
    <div class="menubar">
      <span><u>F</u>ile</span>
      <span><u>V</u>iew</span>
      <span><u>H</u>elp</span>
    </div>
    <div class="body">
      <p class="greeting">
        Welcome back. <b>5 programs installed.</b> Open the one you&rsquo;re told to.
      </p>
      <!-- Story order. Only props the table touches on the iPad; printed props and
           DM pages stay off. Names are rooms, never plot. Renumber run/index.html's
           IPAD map if this list changes. -->
      <ol class="list">
        <li><a class="tile" href="puzzle/" aria-label="Item 1: The Library">
          <span class="num">1</span><span class="name">The Library</span><span class="open">Open</span>
        </a></li>
        <li><a class="tile" href="settlement/" aria-label="Item 2: The Study">
          <span class="num">2</span><span class="name">The Study</span><span class="open">Open</span>
        </a></li>
        <li><a class="tile" href="photo/" aria-label="Item 3: The Photograph">
          <span class="num">3</span><span class="name">The Photograph</span><span class="open">Open</span>
        </a></li>
        <li><a class="tile" href="party-room/" aria-label="Item 4: The Party">
          <span class="num">4</span><span class="name">The Party</span><span class="open">Open</span>
        </a></li>
        <li><a class="tile" href="aim/" aria-label="Item 5: The Computer">
          <span class="num">5</span><span class="name">The Computer</span><span class="open">Open</span>
        </a></li>
      </ol>
    </div>
    <div class="statusbar">
      <span>5 programs · 0 errors</span>
      <span>online</span>
    </div>
  </div>
<script>
  document.addEventListener("touchmove", e => { if (e.scale && e.scale !== 1) e.preventDefault(); }, { passive: false });
</script>
</body>
</html>
