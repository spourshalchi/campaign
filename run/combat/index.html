<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Combat">
<meta name="theme-color" content="#0a0810">
<title>Combat</title>
<style>
  :root{
    --bg:#0a0810; --panel:#16121f; --edge:#2a2038; --ink:#f2eefb; --mut:#b3a8cc; --dim:#7d7196;
    --blood:#e0455d; --gold:#e7b53f; --green:#54c894; --blue:#5b9bd5; --pink:#ec7ac0; --amber:#ffcf7a;
    --rose:#ffb3bf; --line:#4a2530; --card:#1a0f14;
    --f-disp:"Georgia","Times New Roman",serif;
    --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --f-mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.45;font-size:15px;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}
  b{color:var(--ink)}
  #page{display:flex;flex-direction:column;height:100dvh;
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

  /* the bar: back, name, reset, jumps */
  .bar{flex:0 0 auto;padding:max(8px,env(safe-area-inset-top)) 12px 8px;background:#12101a;border-bottom:1px solid var(--edge);
    -webkit-user-select:none;user-select:none}
  .bar-t{display:flex;align-items:center;gap:10px}
  .back,.reset,.jump{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;
    font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
  .back{flex:0 0 auto;padding:0 14px;background:linear-gradient(180deg,#f4cf72,#d9a02f);border:0;color:#1a1206}
  .name{flex:1 1 auto;min-width:0;font-family:var(--f-disp);font-size:19px;line-height:1.2}
  .reset{flex:0 0 auto;padding:0 12px;background:transparent;border:1px solid var(--line);color:var(--rose)}
  .jumps{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
  .jumps::-webkit-scrollbar{display:none}
  .jump{flex:1 1 auto;padding:0 6px;white-space:nowrap;background:var(--panel);border:1px solid var(--edge);color:var(--ink);font-size:14px}

  /* one scroll on a phone; on anything wider, narration left and enemies right, each scrolling alone */
  .panes{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .pane{padding:12px 12px 8px}
  .pane:last-child{padding-bottom:max(28px,env(safe-area-inset-bottom))}
  @media(min-width:760px){
    .panes{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);overflow:hidden}
    .pane{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
      padding-bottom:max(28px,env(safe-area-inset-bottom))}
    .pane + .pane{border-left:1px solid var(--edge)}
    .jump.narrow{display:none}
  }

  .sec{margin:0 0 18px}
  .h{margin:0 0 8px;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);
    -webkit-user-select:none;user-select:none}
  .rule{margin:0 0 10px;padding:10px 12px;border-radius:10px;background:rgba(224,69,93,.09);border:1px solid var(--line);
    border-left:4px solid var(--blood);font-size:15.5px;color:#ffd9de}
  .rule b{color:#fff}
  .row{display:grid;grid-template-columns:82px minmax(0,1fr);gap:10px;padding:5px 0;font-size:15px}
  .row .k{font-weight:800;color:var(--rose);font-size:13px;letter-spacing:.04em;text-transform:uppercase;padding-top:2px}
  .row.tok .k{color:var(--gold)}
  .row.job .k{color:var(--gold)}
  .row.lose .k{color:var(--blue)}

  @media(max-width:479px){
    .bar-t{flex-wrap:wrap;justify-content:space-between}
    .name{order:3;flex-basis:100%}
    .jumps{gap:4px}
    .row,.ally{grid-template-columns:1fr;gap:0}
  }
  @media(max-width:340px){.jump{padding:0 3px;font-size:13px}}

  /* read-alouds: amber is Scott, pink is Spencer */
  .say{margin:0 0 8px;padding:9px 12px;border-radius:10px;background:#17130b;border:1px solid #5a4520}
  .say .who{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
  .say p{margin:0;font-family:var(--f-disp);font-size:18px;line-height:1.4;color:var(--amber)}
  .say p b{color:#fff}
  .say.sp{background:#1d0f1a;border-color:#4f2846}
  .say.sp .who{color:var(--pink)}
  .say.sp p{color:#ffd6ee}

  .rnd{margin:0 0 10px;padding:9px 12px;border-left:3px solid var(--blood);background:var(--panel);border-radius:0 10px 10px 0}
  .rnd-k{margin:0 0 4px;font:700 14px/1.3 var(--f-mono);color:#ff9aaa}
  .rnd-say{margin:0 0 6px;font-family:var(--f-disp);font-size:18px;line-height:1.4;color:var(--amber)}
  .rnd-who{margin:0;font-size:15px}
  .rnd-sp{margin:6px 0 0;font-size:15px;color:#ffd6ee}
  .rnd-sp b{color:var(--pink)}
  .oth{margin:0 0 8px;font-size:15px}
  .oth b{color:var(--rose)}

  /* enemies */
  .foe{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 12px}
  .foe-n{margin:0 0 6px;font-family:var(--f-disp);font-size:19px;color:#ffd9de}
  .foe-x{font-family:var(--f-mono);font-size:15px;color:var(--blood)}
  .st{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px;margin:0 0 8px;-webkit-user-select:none;user-select:none}
  .st div{display:flex;flex-direction:column;min-width:60px;padding:3px 10px 5px;background:#0000004d;border:1px solid var(--line);border-radius:8px}
  .st span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .st b{font-family:var(--f-mono);font-size:26px;line-height:1.1;color:var(--gold)}
  .st .spd b{font-size:16px;line-height:1.6;color:var(--ink)}
  .foe-say{margin:0 0 6px;font-style:italic;color:var(--mut);font-size:14px}
  .foe-l{margin:6px 0 2px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .foe ol{margin:0 0 8px;padding-left:20px;font-size:15px}
  .foe li{margin-bottom:3px}
  .foe li b{color:var(--rose)}
  .foe-note{margin:0 0 8px;font-size:14.5px;color:var(--mut)}
  .foe-note b{color:var(--ink)}
  .foe-drop{margin:8px 0 0;font-size:15px}
  .foe-drop b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--rose);margin-right:4px}
  .dials{display:flex;flex-direction:column;gap:3px;margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);font-size:14px;color:var(--mut)}

  .hps{display:flex;flex-direction:column;gap:6px;-webkit-user-select:none;user-select:none}
  .hp{display:flex;align-items:center;gap:5px}
  .hp-l{flex:0 0 auto;min-width:20px;font:13px var(--f-mono);color:var(--dim)}
  .hp-v{flex:1 1 auto;min-width:38px;font:700 22px var(--f-mono);color:var(--green)}
  .hp button{flex:0 0 auto;min-width:44px;height:44px;padding:0 4px;border-radius:8px;border:1px solid var(--line);background:#2a141b;
    color:#ffd9de;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
  .hp button.up{color:var(--green);background:#122019;border-color:#24503c}
  .hp button:active,.tally button:active{transform:translateY(1px)}
  .hp.down .hp-v{color:var(--blood);text-decoration:line-through}

  .tally{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;margin:0 0 12px;border:2px solid var(--gold);border-radius:10px;
    background:rgba(231,181,63,.08);-webkit-user-select:none;user-select:none}
  .tally .tl{font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--gold)}
  .tally .tv{min-width:36px;text-align:center;font:700 30px var(--f-mono)}
  .tally button{min-width:56px;height:48px;border-radius:9px;border:1px solid #6b5420;background:#2a2210;color:var(--gold);font:inherit;font-size:17px;font-weight:800;cursor:pointer}
  .tally .tp{font-size:15px;color:var(--mut)}
  .tally .tp b{font:700 20px var(--f-mono);color:var(--gold)}

  .allies{border:1px solid #3b3320;border-left:4px solid var(--gold);border-radius:10px;padding:8px 12px;margin:0 0 12px;background:rgba(231,181,63,.06)}
  .ally{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:4px 0;font-size:15px}
  .ally > b{color:var(--gold)}
  .ally-n{margin:4px 0 0;font-size:14px;color:var(--mut)}
  .ally-t{display:block;margin-top:3px;font-size:14px;color:var(--mut)}
  .ally-t b{color:var(--gold)}
  .ally-s{display:block;margin-top:3px;font-family:var(--f-disp);font-size:16px;line-height:1.35;color:var(--amber)}

  /* no ?f=: pick a fight */
  .menu{flex:1 1 auto;overflow-y:auto;padding:14px 12px max(28px,env(safe-area-inset-bottom))}
  .menu a{display:flex;align-items:center;min-height:52px;padding:8px 14px;margin:0 0 8px;border-radius:10px;background:var(--card);border:1px solid var(--line);
    color:#ffd9de;font-family:var(--f-disp);font-size:18px;text-decoration:none}
</style>
</head>
<body>
<div id="page"></div>
<script src="../fights.js?v=14"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const PKEY = "dood_combat_v1", POS = "dood_pos_v1";
const inRoS = window.parent !== window;
function load(){ try{ return JSON.parse(localStorage.getItem(PKEY))||{}; }catch(e){ return {}; } }
function save(o){ try{ localStorage.setItem(PKEY,JSON.stringify(o)); }catch(e){} }

const key = new URLSearchParams(location.search).get("f");
const F = Object.prototype.hasOwnProperty.call(FIGHTS,key) ? FIGHTS[key] : null;
const backBtn = label => `<a class="back" href="../" id="back">&lsaquo; ${label}</a>`;

/* ---- the fight, in the order it gets used ---- */
const row = (k,v,cls) => v ? `<div class="row ${cls||""}"><span class="k">${k}</span><span>${v}</span></div>` : "";
const says = list => (list||[]).map(r=>r.note?`<p class="oth">${r.note}</p>`:`<div class="say${r.sp?" sp":""}"><span class="who">${r.sp?"Spencer · ":""}${r.who}</span><p>${r.t}</p></div>`).join("");
const round = r => `<div class="rnd"><p class="rnd-k">${r.k}</p><p class="rnd-say">${r.say}</p><p class="rnd-who">${r.who}</p>${r.sp?`<p class="rnd-sp"><b>Spencer</b> ${r.sp}</p>`:""}</div>`;

function narration(f){
  const g = f.guide||{}, read = f.read||{}, r = f.run;
  return `<p class="rule">${f.rule}</p>${row("Win",r.win)}${row("Ends",r.ends)}`+
    `<div class="sec" id="s-setup" style="margin-top:14px"><p class="h">Set up</p>`+
      row("Setup",r.setup)+row("Tokens",g.tokens,"tok")+row("Matchups",r.matchups)+row("Allies",r.allyJob,"job")+
      (read.open?`<div style="margin-top:10px">${says(read.open)}</div>`:"")+`</div>`+
    `<div class="sec" id="s-rounds"><p class="h">Round by round</p>`+
      (g.rounds||[]).map(round).join("")+
      (f.lines?`<p class="h" style="margin-top:14px">Spencer, during the fight</p>${says(f.lines.map(l=>({...l,sp:1})))}`:"")+`</div>`+
    `<div class="sec" id="s-if"><p class="h">If they do something else</p>`+
      (g.other||[]).map(([k,v])=>`<p class="oth"><b>${k}.</b> ${v}</p>`).join("")+row("Losing?",r.losing,"lose")+`</div>`+
    (read.close?`<div class="sec" id="s-end"><p class="h">Ending it</p>${says(read.close)}</div>`:"");
}

const tallyOut = (t,v) => (t.tiers.find(([m])=>v<=m)||t.tiers[t.tiers.length-1])[1];
function enemies(f,st){
  const tally = f.tally ? `<div class="tally" data-tally><span class="tl">${f.tally.label}</span>`+
    `<button data-tad="-1" aria-label="One fewer">&minus;1</button><span class="tv"></span><button data-tad="1" aria-label="One more">+1</button>`+
    `<span class="tp">&rarr; <b></b> pieces</span></div>` : "";
  const hpRow = (x,i) => `<div class="hp" data-hp="${x.id}:${i}" data-max="${x.hp}" data-min="${x.floor||0}">`+
    `<span class="hp-l">${x.n>1?i+1:""}</span><span class="hp-v"></span>`+
    `<button data-d="-1">&minus;1</button><button data-d="-5">&minus;5</button><button data-d="-10">&minus;10</button>`+
    `<button data-d="1" class="up">+1</button></div>`;
  const cards = f.foes.map(x=>`<div class="foe"><p class="foe-n">${x.nm}${x.n>1?` <span class="foe-x">&times;${x.n}</span>`:""}</p>`+
    `<div class="st"><div><span>AC</span><b>${x.ac}</b></div><div><span>HP</span><b>${x.hp||"&mdash;"}</b></div><div class="spd"><span>Speed</span><b>${x.spd}</b></div></div>`+
    (x.say?`<p class="foe-say">${x.say}</p>`:"")+
    `<p class="foe-l">On its turn</p><ol>${x.turn.map(t=>`<li>${t}</li>`).join("")}</ol>`+
    (x.note?`<p class="foe-note">${x.note}</p>`:"")+
    (x.hp?`<div class="hps">${Array.from({length:x.n},(_,i)=>hpRow(x,i)).join("")}</div>`:"")+
    `<p class="foe-drop"><b>When it drops</b> ${x.drop}</p>`+
    `<div class="dials"><div><b>Too hard?</b> ${x.hard}</div><div><b>Too easy?</b> ${x.easy}</div></div></div>`).join("");
  const allies = f.allies ? `<div class="allies"><p class="foe-l">${f.alliesLabel||"Allies"}</p>`+
    f.allies.map(a=>`<div class="ally"><b>${a.nm}</b><span>${a.act}${a.tok?`<span class="ally-t"><b>Token</b> ${a.tok}</span>`:""}${a.say?`<span class="ally-s">${a.say}</span>`:""}</span></div>`).join("")+
    (f.allyNote?`<p class="ally-n">${f.allyNote}</p>`:"")+`</div>` : "";
  return tally+cards+allies;
}

/* ---- HP and the tally, kept per fight until Reset ---- */
function paint(f){
  const st = load()[key]||{};
  document.querySelectorAll("[data-hp]").forEach(el=>{
    const k=el.dataset.hp, v = k in st ? st[k] : +el.dataset.max;
    el.querySelector(".hp-v").textContent=v; el.classList.toggle("down",v<=0); });
  const t=$("[data-tally]"); if(t){ const v = "tally" in st ? st.tally : f.tally.start;
    t.querySelector(".tv").textContent=v; t.querySelector(".tp b").textContent=tallyOut(f.tally,v); }
}
function setVal(k,v){ const all=load(); (all[key]=all[key]||{})[k]=v; save(all); }

function fightPage(f){
  document.title = "Combat · "+f.name.replace(/&mdash;/g,"—").replace(/&[^;]+;/g,"");
  const jump = (id,label,cls) => `<button class="jump ${cls||""}" data-jump="${id}">${label}</button>`;
  $("#page").innerHTML =
    `<div class="bar"><div class="bar-t">${backBtn(`Back to cue ${f.cue}`)}<span class="name">${f.name}</span>`+
      `<button class="reset" id="reset">Reset fight</button></div>`+
      `<div class="jumps">${jump("s-setup","Set up")}${jump("s-rounds","Rounds")}${jump("s-if","What if")}`+
      `${f.read&&f.read.close?jump("s-end","Ending"):""}${jump("s-foes","Enemies","narrow")}</div></div>`+
    `<div class="panes" id="panes"><div class="pane" id="p-narr">${narration(f)}</div>`+
      `<div class="pane" id="s-foes">${enemies(f)}</div></div>`;
  paint(f);

  $("#page").addEventListener("click",e=>{
    const j=e.target.closest("[data-jump]"); if(j){ const el=document.getElementById(j.dataset.jump);
      const box = getComputedStyle($("#panes")).display==="grid" ? el.closest(".pane") : $("#panes");
      box.scrollTop += el.getBoundingClientRect().top - box.getBoundingClientRect().top - 8; return; }
    if(e.target.closest("#reset")){ if(confirm("Reset this fight's HP"+(f.tally?" and "+f.tally.label.toLowerCase():"")+"?")){
      const all=load(); delete all[key]; save(all); paint(f); } return; }
    const b=e.target.closest("[data-d]"); if(b){ const r=b.closest("[data-hp]"), k=r.dataset.hp, st=load()[key]||{}, max=+r.dataset.max;
      setVal(k, Math.min(max, Math.max(+r.dataset.min, (k in st?st[k]:max) + (+b.dataset.d)))); paint(f); return; }
    const t=e.target.closest("[data-tad]"); if(t){ const st=load()[key]||{};
      setVal("tally", Math.max(0, ("tally" in st?st.tally:f.tally.start) + (+t.dataset.tad))); paint(f); return; }
  });
}

/* ---- no fight named: pick one ---- */
function menu(){
  document.title = "Combat";
  const days = [...new Set(Object.values(FIGHTS).map(f=>f.day))];
  $("#page").innerHTML = `<div class="bar"><div class="bar-t">${backBtn("Run of Show")}<span class="name">Combat</span></div></div>`+
    `<div class="menu">${days.map(d=>`<p class="h">${d}</p>`+Object.keys(FIGHTS).filter(k=>FIGHTS[k].day===d)
      .map(k=>`<a href="?f=${k}">${FIGHTS[k].name}</a>`).join("")).join("")}</div>`;
}

F ? fightPage(F) : menu();

/* ---- the way back ---- */
$("#back").addEventListener("click",e=>{
  if(inRoS){ e.preventDefault(); window.parent.postMessage("combat-close",location.origin); return; }
  if(F){ try{ localStorage.setItem(POS,JSON.stringify({no:String(F.cue)})); }catch(err){} }
});
// inside the Run of Show its keys (cue sounds, next cue) keep working
if(inRoS) document.addEventListener("keydown",e=>{
  try{ window.parent.document.dispatchEvent(new KeyboardEvent("keydown",{key:e.key,code:e.code,shiftKey:e.shiftKey})); }catch(err){} });

// block pinch-zoom
document.addEventListener("touchmove",e=>{ if(e.scale && e.scale!==1) e.preventDefault(); },{passive:false});
</script>
</body>
</html>
