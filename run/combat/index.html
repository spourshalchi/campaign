<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Combat">
<meta name="theme-color" content="#0a0810">
<title>Combat</title>
<style>
  :root{
    --bg:#0a0810; --panel:#16121f; --edge:#2a2038; --ink:#f2eefb; --mut:#b3a8cc; --dim:#7d7196;
    --blood:#e0455d; --gold:#e7b53f; --green:#54c894; --blue:#5b9bd5; --pink:#ec7ac0; --amber:#ffcf7a;
    --rose:#ffb3bf; --line:#4a2530; --card:#1a0f14;
    --f-disp:"Georgia","Times New Roman",serif;
    --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --f-mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;width:100%;overflow:hidden}
  body{background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.45;font-size:16px;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}
  b{color:var(--ink)}
  #page{display:flex;flex-direction:column;height:100dvh;
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  button{font:inherit;cursor:pointer}

  /* the bar: back, name, jumps to the four steps */
  .bar{flex:0 0 auto;padding:max(8px,env(safe-area-inset-top)) 12px 8px;background:#12101a;border-bottom:1px solid var(--edge);
    -webkit-user-select:none;user-select:none}
  .bar-t{display:flex;align-items:center;gap:10px}
  .back,.jump,.go{display:inline-flex;align-items:center;justify-content:center;min-height:44px;border-radius:10px;
    font-weight:700;text-decoration:none}
  .back{flex:0 0 auto;padding:0 14px;background:linear-gradient(180deg,#f4cf72,#d9a02f);border:0;color:#1a1206}
  .name{flex:1 1 auto;min-width:0;font-family:var(--f-disp);font-size:19px;line-height:1.2}
  .jumps{display:flex;gap:6px;margin-top:8px}
  .jump{flex:1 1 0;min-width:0;padding:0 4px;white-space:nowrap;background:var(--panel);border:1px solid var(--edge);color:var(--ink);font-size:15px}

  /* one column, read top to bottom */
  .scroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .col{max-width:760px;margin:0 auto;padding:4px 12px max(40px,env(safe-area-inset-bottom))}

  .step{margin:0;padding:14px 0 6px}
  .step-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding-bottom:8px;border-bottom:2px solid var(--line);
    font-family:var(--f-disp);font-size:24px;font-weight:400;line-height:1.2;color:#fff;-webkit-user-select:none;user-select:none}
  .step-n{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
    background:var(--blood);color:#fff;font:800 18px var(--f-body)}
  .sub-h{margin:16px 0 6px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);
    -webkit-user-select:none;user-select:none}
  .line{margin:0 0 8px;font-size:16px}
  .small{margin:6px 0 0;font-size:14.5px;color:var(--mut)}
  .small b{color:var(--ink)}
  .go{padding:0 14px;margin-top:8px;background:#2a2210;border:1px solid #6b5420;color:var(--gold)}

  /* read-alouds: amber is Scott, pink is Spencer */
  .say{margin:0 0 8px;padding:9px 12px;border-radius:10px;background:#17130b;border:1px solid #5a4520}
  .say .who{display:block;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin-bottom:2px}
  .say p{margin:0;font-family:var(--f-disp);font-size:18.5px;line-height:1.4;color:var(--amber)}
  .say p b{color:#fff}
  .say.sp{background:#1d0f1a;border-color:#4f2846}
  .say.sp .who{color:var(--pink)}
  .say.sp p{color:#ffd6ee}

  /* 1: the opening checklist */
  .act{margin:0 0 8px;padding:9px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--edge)}
  .act-k{display:block;font-weight:800;font-size:17px;color:#fff}
  .act ul{margin:4px 0 0;padding-left:20px}
  .act li{margin-bottom:2px}

  /* 1: the map: a working diagram, 1 square = 1 inch on the mat */
  .map-size{margin:4px 0 8px}
  .map-w{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 10px;border-radius:8px;background:#0d0a14}
  .map-w svg{display:block;width:100%;min-width:540px;height:auto}
  .m-grid{stroke:#3a3350;stroke-width:1;fill:none}
  .m-co{fill:var(--mut);font:700 13px var(--f-body);text-anchor:middle;dominant-baseline:central}
  .m-zone{fill:rgba(91,155,213,.16);stroke:var(--blue);stroke-width:1.5;stroke-dasharray:6 4}
  .m-s{fill:none;stroke:#efe9fb;stroke-width:3;stroke-linecap:round}
  .m-s.base{stroke:#8d84a6;stroke-width:2}
  .m-l{fill:#fff;font:700 13px var(--f-body);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#0d0a14;stroke-width:4px;stroke-linejoin:round}
  .m-l.base{fill:#b3a8cc}
  .m-t{stroke-width:2}
  .m-t.m-foe{fill:#a92a40;stroke:#ffb3bf}
  .m-t.m-ally{fill:#c79a2e;stroke:#ffe6a6}
  .m-t.m-pc{fill:#2f6aa8;stroke:#b6d8f5}
  .m-t.side{stroke-dasharray:5 4;stroke-width:3}
  .m-tl{fill:#fff;font:700 9.5px var(--f-body);text-anchor:middle;dominant-baseline:central}
  .m-tl.m-ally{fill:#1a1206}
  .draw{margin:0;padding-left:24px}
  .act .draw li{margin-bottom:10px}
  .draw-say{display:block;margin-top:2px;font-family:var(--f-disp);font-size:17.5px;line-height:1.35;color:var(--amber)}
  .tk-k{font-weight:800}
  .tk-foe{color:#ffb3bf}.tk-ally{color:var(--gold)}.tk-pc{color:#9cc8ee}
  .tk{margin:0 0 6px}

  /* 2: the rounds */
  .rnd{margin:0 0 12px;padding:9px 12px;border-left:4px solid var(--blood);background:var(--panel);border-radius:0 10px 10px 0}
  .rnd-k{margin:0 0 6px;font-weight:800;font-size:17px;color:#fff}
  .rnd .line:last-child,.rnd .say:last-child{margin-bottom:0}

  /* 3: on my turn */
  .foe{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
  .foe.out .foe-h,.foe.out .def,.foe.out ul,.foe.out .hp{opacity:.45}
  .foe .hp-wrap{margin:0 0 8px;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .foe-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 6px}
  .foe-n{font-family:var(--f-disp);font-size:20px;color:#ffd9de}
  .foe-m{font-size:14px;color:var(--mut)}
  .def{margin:0 0 8px;padding:6px 8px;border-left:3px solid var(--line);font-size:15px;line-height:1.35}
  .def p{margin:0 0 2px}
  .def b{color:var(--ink)}
  .foe ul{margin:0;padding:0;list-style:none}
  .foe li{margin:0 0 6px;font-size:16px}
  .foe li b{color:var(--rose)}
  .mini{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);
    -webkit-user-select:none;user-select:none}
  .mini b{font:700 22px var(--f-mono);color:var(--gold)}
  .allies{border:1px solid #3b3320;border-left:4px solid var(--gold);border-radius:10px;padding:8px 12px;margin:14px 0 10px;background:rgba(231,181,63,.06)}
  .allies-h{margin:0 0 6px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
  .ally{padding:6px 0;border-top:1px solid #3b3320}
  .ally:first-of-type{border-top:0}
  .ally > b{display:block;color:var(--gold)}
  .ally-t{display:block;margin-top:3px;font-size:14.5px;color:var(--mut)}
  .ally-t b{color:var(--gold)}

  /* HP trackers and the tally */
  .trk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
  .hp{padding:0 0 10px;-webkit-user-select:none;user-select:none}
  .hp + .hp{padding-top:10px;border-top:1px solid var(--line)}
  .hp-t{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
  .hp-n{flex:1 1 100%;font-weight:800;font-size:17px;color:#ffd9de}
  .hp-v{font:700 34px/1.1 var(--f-mono);color:var(--green)}
  .hp.down .hp-v{color:var(--blood)}
  .hp-of{font-size:15px;color:var(--mut)}
  .hp-b{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
  .hp-k{font-size:13px;color:var(--dim)}
  .hp-g{display:inline-flex;align-items:center;gap:6px}
  .hp-b button,.tally button,.mini button{min-width:52px;height:46px;padding:0 8px;border-radius:9px;border:1px solid var(--line);background:#2a141b;
    color:#ffd9de;font-size:16px;font-weight:700}
  .hp-b button.up{color:var(--green);background:#122019;border-color:#24503c}
  .hp-b button:active,.tally button:active,.mini button:active{transform:translateY(1px)}
  .trk-note{margin:0 0 6px;font-size:15px;color:var(--ink)}
  .trk-drop{margin:8px 0 0;padding:8px 10px;border-radius:8px;background:#00000040;font-size:15.5px}
  .trk-drop b{color:var(--rose)}
  .foe.dropped .trk-drop{background:rgba(231,181,63,.14);outline:1px solid var(--gold)}
  .tally{border:2px solid var(--gold);background:rgba(231,181,63,.08);-webkit-user-select:none;user-select:none}
  .tally .hp-n{color:var(--gold)}
  .tally .tv{font:700 34px/1.1 var(--f-mono);color:var(--ink)}
  .tally button,.mini button{border-color:#6b5420;background:#2a2210;color:var(--gold)}
  .tiers{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .tier{padding:4px 10px;border-radius:8px;border:1px solid #6b5420;font-size:15px;color:var(--mut)}
  .tier.on{background:var(--gold);border-color:var(--gold);color:#1a1206;font-weight:800}
  .tally-full{margin:8px 0 0;font-weight:700;color:#fff}
  .reset{min-height:44px;padding:0 14px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--rose);font-weight:700}

  /* 5: the way out */
  .next{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--edge)}
  .next .back{width:100%;margin-top:8px;min-height:52px;font-size:17px}

  /* no ?f=: pick a fight */
  .menu{flex:1 1 auto;overflow-y:auto;padding:14px 12px max(28px,env(safe-area-inset-bottom))}
  .menu .sub-h{margin-top:0}
  .menu a{display:flex;align-items:center;min-height:52px;padding:8px 14px;margin:0 0 8px;border-radius:10px;background:var(--card);border:1px solid var(--line);
    color:#ffd9de;font-family:var(--f-disp);font-size:18px;text-decoration:none}
</style>
</head>
<body>
<div id="page"></div>
<script src="../fights.js?v=32"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const PKEY = "dood_combat_v1", POS = "dood_pos_v1";
const inRoS = window.parent !== window;
function load(){ try{ return JSON.parse(localStorage.getItem(PKEY))||{}; }catch(e){ return {}; } }
function save(o){ try{ localStorage.setItem(PKEY,JSON.stringify(o)); }catch(e){} }

const key = new URLSearchParams(location.search).get("f");
const F = Object.prototype.hasOwnProperty.call(FIGHTS,key) ? FIGHTS[key] : null;
const backBtn = label => `<a class="back" href="../" data-back>${label}</a>`;
const goBtn = (id,label) => `<button class="go" data-jump="${id}">${label}</button>`;

/* ---- pieces ---- */
const said = l => l.note ? `<p class="line">${l.note}</p>` :
  `<div class="say${l.sp?" sp":""}"><span class="who">${l.sp?"Spencer · ":"Say"+(l.who?" · ":"")}${l.who||""}</span><p>${l.t}</p></div>`;
const step = (id,n,title,body) => `<section class="step" id="${id}"><h2 class="step-h"><span class="step-n">${n}</span>${title}</h2>${body}</section>`;
const hpName = (x,i) => x.n>1 ? `${x.one||x.nm} ${i+1}` : x.nm;

/* ---- the set-up map: squares are letter + number, A1 top left ---- */
const COL = "ABCDEFGHIJKLMNOP", SQ = 44, MG = 26;
const cx = c => COL.indexOf(c[0]), cy = c => +c.slice(1)-1;
const mid = c => [MG+cx(c)*SQ+SQ/2, MG+cy(c)*SQ+SQ/2];
function block(a,b){ const x=MG+cx(a)*SQ, y=MG+cy(a)*SQ; return {x,y,w:(cx(b)-cx(a)+1)*SQ,h:(cy(b)-cy(a)+1)*SQ}; }
function shape(d,base){
  const cl = `m-s${base?" base":""}`;
  const one = (a,b) => {
    if(d.s==="rect"){ const r=block(a,b); return `<rect class="${cl}" x="${r.x+3}" y="${r.y+3}" width="${r.w-6}" height="${r.h-6}" rx="2"/>`; }
    if(d.s==="circle"){ const r=block(a,b); return `<ellipse class="${cl}" cx="${r.x+r.w/2}" cy="${r.y+r.h/2}" rx="${r.w/2-3}" ry="${r.h/2-3}"/>`; }
    if(d.s==="line"){ const [x1,y1]=mid(a), [x2,y2]=mid(b); return `<line class="${cl}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }
    if(d.s==="x"){ const [x,y]=mid(a), k=13; return `<path class="${cl}" d="M${x-k} ${y-k}L${x+k} ${y+k}M${x+k} ${y-k}L${x-k} ${y+k}"/>`; }
    if(d.s==="dot"){ const [x,y]=mid(a); return `<circle class="${cl}" cx="${x}" cy="${y}" r="7"/>`; }
    return "";
  };
  const pairs = d.s==="dot" ? d.at.map(a=>[a]) : [[d.a,d.b],...(d.also||[])];
  const lab = d.l===0 ? "" : (()=>{ const [x,y] = d.lp ? mid(d.lp) : (()=>{ const r=block(d.a,d.b||d.a); return [r.x+r.w/2,r.y+r.h/2]; })();
    const ls=(d.l||d.nm).split("|");
    return ls.map((w,i)=>`<text class="m-l${base?" base":""}" x="${x}" y="${y+(i-(ls.length-1)/2)*16}">${w}</text>`).join(""); })();
  return pairs.map(([a,b])=>one(a,b)).join("")+lab;
}
function token(t){
  const n=t.size||1, x=MG+cx(t.at)*SQ+SQ*n/2, y=MG+cy(t.at)*SQ+SQ*n/2, ls=t.l.split(" "), dy=12;
  return `<circle class="m-t m-${t.k}${t.side?" side":""}" cx="${x}" cy="${y}" r="${SQ*n/2-3}"/>`+
    ls.map((w,i)=>`<text class="m-tl m-${t.k}" x="${x}" y="${y+(i-(ls.length-1)/2)*dy}">${w}</text>`).join("");
}
function mapSvg(g){
  const w=MG+g.cols*SQ+6, h=MG+g.rows*SQ+6; let lines="", co="";
  for(let i=0;i<=g.cols;i++) lines+=`<line class="m-grid" x1="${MG+i*SQ}" y1="${MG}" x2="${MG+i*SQ}" y2="${MG+g.rows*SQ}"/>`;
  for(let i=0;i<=g.rows;i++) lines+=`<line class="m-grid" x1="${MG}" y1="${MG+i*SQ}" x2="${MG+g.cols*SQ}" y2="${MG+i*SQ}"/>`;
  for(let i=0;i<g.cols;i++) co+=`<text class="m-co" x="${MG+i*SQ+SQ/2}" y="13">${COL[i]}</text>`;
  for(let i=0;i<g.rows;i++) co+=`<text class="m-co" x="13" y="${MG+i*SQ+SQ/2}">${i+1}</text>`;
  const zone = g.party ? (()=>{ const r=block(g.party.a,g.party.b); return `<rect class="m-zone" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}"/>`; })() : "";
  return `<div class="map-w"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Set-up map">${lines}${co}${zone}`+
    (g.base||[]).map(d=>shape(d,1)).join("")+(g.draw||[]).map(d=>shape(d)).join("")+g.tokens.map(token).join("")+`</svg></div>`;
}
function drawText(d){
  const also = (d.also||[]).map(([a,b])=>`, and another from ${a} to ${b}`).join("");
  if(d.s==="rect") return `Draw a rectangle from ${d.a} to ${d.b}${also}.`;
  if(d.s==="line") return `Draw a straight line from ${d.a} to ${d.b}${also}.`;
  if(d.s==="circle") return `Draw a circle that fills the block from ${d.a} to ${d.b}.`;
  if(d.s==="x") return `Draw an X on ${d.a}.`;
  if(d.s==="dot") return `Draw a small circle on each of ${d.at.slice(0,-1).join(", ")} and ${d.at[d.at.length-1]}.`;
  return "";
}
function mapHTML(g){
  const size = `<p class="map-size">Use a block ${g.cols} squares across (A to ${COL[g.cols-1]}) and ${g.rows} down (1 to ${g.rows}). A1 is the top left square.</p>`;
  const draw = (g.draw||[]).length ? `<p class="sub-h">${g.base?"Then draw, and say":"Draw, and say as you draw"}</p><ol class="draw">${g.draw.map(d=>
    `<li><b>${d.nm}.</b> ${drawText(d)}${d.say?`<span class="draw-say">${d.say}</span>`:""}</li>`).join("")}</ol>` : "";
  const groups = [["foe","Enemies"],["ally","Allies"],["pc","The party"]];
  const place = t => `${t.nm} ${t.size?`${t.at} to ${COL[cx(t.at)+t.size-1]}${cy(t.at)+t.size}`:t.at}${t.side?" (on its side)":""}`;
  const toks = groups.map(([k,lab])=>{ const ts=g.tokens.filter(t=>t.k===k);
    return ts.length?`<p class="tk"><span class="tk-k tk-${k}">${lab}:</span> ${ts.map(place).join(", ")}.${k==="pc"&&g.party?` Or anywhere they like from ${g.party.a} to ${g.party.b}.`:""}</p>`:""; }).join("");
  return (g.base?"":size)+(g.lead?`<p class="map-size">${g.lead}</p>`:"")+mapSvg(g)+draw+`<p class="sub-h">Tokens</p>${toks}`;
}

/* ---- 1. start the fight ---- */
function stepStart(f){
  const s = f.start;
  const act = (k,v) => `<div class="act"><span class="act-k">${k}</span>${v}</div>`;
  return step("s-start",1,"Start the fight",
    (s.read||[]).map(said).join("")+
    act("Announce: roll for initiative", s.announce||"")+
    act("Record initiative", "Write down each player's roll. Roll once for all the enemies together.")+
    act("Set up the combat map", (s.grid?mapHTML(s.grid):"")+(s.map&&s.map.length?`<ul>${s.map.map(t=>`<li>${t}</li>`).join("")}</ul>`:"")));
}

/* ---- 2. round by round ---- */
function stepRounds(f){
  const round = r => `<div class="rnd"><p class="rnd-k">${r.k}</p>`+
    (r.do?`<p class="line">${r.do}</p>`:"")+
    (r.sp||[]).map(l=>said({...l,sp:1})).join("")+`</div>`;
  return step("s-rounds",2,"Round by round",
    f.rounds.map(round).join(""));
}

/* ---- 3. on my turn: the tally, then every enemy with its HP, then the allies ---- */
const tierName = (t,v) => (t.tiers.find(([m])=>v<=m)||t.tiers[t.tiers.length-1])[1];
const tallyMax = t => t.max||t.tiers[t.tiers.length-2][0]+1;
function stepTurn(f){
  const sg = n => (n<0?"&minus;":"+")+Math.abs(n);
  const defs = x => !x.sv ? "" : `<div class="def"><p><b>AC ${x.ac} · HP ${x.hp}${x.floor?` (can't drop below ${x.floor})`:""}</b></p>`+
    `<p><b>Saves:</b> ${["STR","DEX","CON","INT","WIS","CHA"].map((k,i)=>`${k} ${sg(x.sv[i])}`).join(" · ")}</p>`+
    (x.aura?`<p><b>Saves with Stinky within 10 ft</b> (+${x.aura} added, until Stinky turns): ${["STR","DEX","CON","INT","WIS","CHA"].map((k,i)=>`${k} ${sg(x.sv[i]+x.aura)}`).join(" · ")}</p>`:"")+
    `<p><b>Grapple / shove:</b> ${x.grab} · <b>Passive Perception</b> ${x.pp}</p>`+
    (x.cast?`<p><b>Spells:</b> ${x.cast}</p>`:"")+
    (x.res?`<p><b>Resists:</b> ${x.res}</p>`:"")+(x.imm?`<p><b>Immune:</b> ${x.imm}</p>`:"")+(x.vul?`<p><b>Vulnerable:</b> ${x.vul}</p>`:"")+
    (x.cimm?`<p><b>Can't be:</b> ${x.cimm}</p>`:"")+
    (!x.res&&!x.imm&&!x.vul&&!x.cimm?`<p>No resistances or immunities.</p>`:"")+`</div>`;
  const hpRow = (x,i) => `<div class="hp" data-hp="${x.id}:${i}" data-max="${x.hp}" data-min="${x.floor||0}" data-of="of ${x.hp}">`+
    `<div class="hp-t"><span class="hp-n">${hpName(x,i)}: HP</span><span class="hp-v"></span><span class="hp-of"></span></div>`+
    `<div class="hp-b"><span class="hp-g"><span class="hp-k">Subtract</span><button data-d="-1">&minus;1</button><button data-d="-5">&minus;5</button><button data-d="-10">&minus;10</button></span>`+
    `<span class="hp-g"><span class="hp-k">Add back</span><button data-d="1" class="up">+1</button><button data-d="5" class="up">+5</button></span></div></div>`;
  const foe = x => `<div class="foe" data-foe="${x.id}"><div class="foe-h"><span class="foe-n">${x.nm}${x.n>1?` &times;${x.n}`:""}</span>`+
      `<span class="foe-m">speed ${x.spd}</span></div>`+defs(x)+
    `<div class="hp-wrap">${Array.from({length:x.n},(_,i)=>hpRow(x,i)).join("")}`+
      (x.hpnote?`<p class="trk-note">${x.hpnote}</p>`:"")+`</div>`+
    `<ul>${x.turn.map(t=>`<li>${t}</li>`).join("")}</ul>`+
    (x.sayIf||[]).map(said).join("")+
    (x.note?`<p class="small">${x.note}</p>`:"")+
    (f.tally&&f.tally.foe===x.id?`<div class="mini" data-tally><span>${f.tally.label}</span><b class="tv"></b><button data-tad="1">+1 cut</button></div>`:"")+
    (x.hard||x.easy?`<p class="small">${x.hard?`<b>Too hard?</b> ${x.hard} `:""}${x.easy?`<b>Too easy?</b> ${x.easy}`:""}</p>`:"")+
    `<p class="trk-drop"><b>When it drops:</b> ${x.drop}</p>`+
    (x.endsFight?goBtn("s-end","Go to step 4: Ending"):"")+`</div>`;
  const allies = f.allies ? `<div class="allies"><p class="allies-h">${f.alliesLabel||"Allies"}</p>`+
    f.allies.map(a=>`<div class="ally"><b>${a.nm}</b>${a.act}${a.tok?`<span class="ally-t"><b>Token:</b> ${a.tok}</span>`:""}</div>`).join("")+
    (f.allyNote?`<p class="small">${f.allyNote}</p>`:"")+`</div>` : "";
  const t = f.tally;
  const tally = t ? `<div class="trk tally" data-tally>`+
    `<div class="hp-t"><span class="hp-n">${t.label}: tally</span><span class="tv"></span></div>`+
    `<div class="hp-b"><button data-tad="-1">&minus;1 cut</button><button data-tad="1">+1 cut</button></div>`+
    `<div class="tiers">${t.tiers.map(([m,nm],i,a)=>`<span class="tier" data-tier="${nm}">${i===0?`Up to ${m} cuts`:i===a.length-1?`${a[i-1][0]+1===tallyMax(t)?a[i-1][0]+1:(a[i-1][0]+1)+" or more"} cuts`:`${a[i-1][0]+1===m?m:(a[i-1][0]+1)+"&ndash;"+m} cuts`} = ${nm}</span>`).join("")}</div>`+
    `<p class="small">${t.use}</p>`+
    `<div class="tally-full" hidden>${t.full}</div></div>` : "";
  return step("s-turn",3,"On my turn",
    tally+
    `<p class="line">${f.turnIntro||"All the enemies go together, in this order. Skip any that are down."}</p>`+
    f.foes.map(foe).join("")+allies+
    (t&&t.allDown?`<div class="all-down" hidden>${goBtn("s-end","All down. Go to step 4: Ending")}</div>`:"")+
    `<button class="reset" id="reset">Reset: put all HP${t?" and "+t.label.toLowerCase():""} back to the start</button>`);
}

/* ---- 4. ending ---- */
function stepEnd(f){
  const e = f.end;
  return step("s-end",4,"Ending",
    (e.when?`<p class="line"><b>${e.when}</b></p>`:"")+
    (e.read||[]).map(said).join("")+
    `<div class="next"><span class="act-k">What comes next</span>${e.next||""}`+
    backBtn(`Back to the Run of Show: cue ${f.cue}`)+`</div>`);
}

/* ---- HP and the tally, kept per fight until Reset ---- */
function paint(f){
  const st = load()[key]||{};
  const hpOf = (k,max) => k in st ? st[k] : max;
  $$("[data-hp]").forEach(el=>{ const v=hpOf(el.dataset.hp,+el.dataset.max);
    el.querySelector(".hp-v").textContent=v; el.querySelector(".hp-of").textContent=el.dataset.of; el.classList.toggle("down",v<=0); });
  f.foes.forEach(x=>{
    const downs = Array.from({length:x.n},(_,i)=>hpOf(`${x.id}:${i}`,x.hp)<=0);
    $(`[data-foe="${x.id}"]`).classList.toggle("out",downs.every(Boolean));
    $(`[data-foe="${x.id}"]`).classList.toggle("dropped",downs.some(Boolean)); });
  if(f.tally){ const v = "tally" in st ? st.tally : f.tally.start, tier = tierName(f.tally,v);
    $$("[data-tally] .tv").forEach(el=>{ el.textContent=v; });
    $$("[data-tier]").forEach(el=>el.classList.toggle("on",el.dataset.tier===tier));
    $$("[data-tier-now]").forEach(el=>{ el.textContent=tier; });
    $(".tally-full").hidden = v<tallyMax(f.tally);
    if(f.tally.allDown) $(".all-down").hidden = !f.foes.every(x=>Array.from({length:x.n},(_,i)=>hpOf(`${x.id}:${i}`,x.hp)<=0).every(Boolean)); }
}
function setVal(k,v){ const all=load(); (all[key]=all[key]||{})[k]=v; save(all); }

function fightPage(f){
  document.title = "Combat · "+f.name.replace(/&mdash;/g,"—").replace(/&[^;]+;/g,"");
  const jump = (id,label) => `<button class="jump" data-jump="${id}">${label}</button>`;
  $("#page").innerHTML =
    `<div class="bar"><div class="bar-t">${backBtn(`&lsaquo; Cue ${f.cue}`)}<span class="name">${f.name}</span></div>`+
      `<div class="jumps">${jump("s-start","Start")}${jump("s-rounds","Rounds")}${jump("s-turn","My turn")}${jump("s-end","Ending")}</div></div>`+
    `<div class="scroll" id="scroll"><div class="col">${stepStart(f)}${stepRounds(f)}${stepTurn(f)}${stepEnd(f)}</div></div>`;
  paint(f);

  $("#page").addEventListener("click",e=>{
    const j=e.target.closest("[data-jump]"); if(j){ const el=document.getElementById(j.dataset.jump), box=$("#scroll");
      box.scrollTop += el.getBoundingClientRect().top - box.getBoundingClientRect().top; return; }
    if(e.target.closest("#reset")){ if(confirm("Put all HP"+(f.tally?" and "+f.tally.label.toLowerCase():"")+" back to the start?")){
      const all=load(); delete all[key]; save(all); paint(f); } return; }
    const b=e.target.closest("[data-d]"); if(b){ const r=b.closest("[data-hp]"), k=r.dataset.hp, st=load()[key]||{}, max=+r.dataset.max;
      setVal(k, Math.max(+r.dataset.min, (k in st?st[k]:max) + (+b.dataset.d))); paint(f); return; }
    const t=e.target.closest("[data-tad]"); if(t){ const st=load()[key]||{};
      setVal("tally", Math.min(tallyMax(f.tally), Math.max(0, ("tally" in st?st.tally:f.tally.start) + (+t.dataset.tad)))); paint(f); return; }
  });
}

/* ---- no fight named: pick one ---- */
function menu(){
  document.title = "Combat";
  const days = [...new Set(Object.values(FIGHTS).map(f=>f.day))];
  $("#page").innerHTML = `<div class="bar"><div class="bar-t">${backBtn("&lsaquo; Run of Show")}<span class="name">Combat</span></div></div>`+
    `<div class="menu">${days.map(d=>`<p class="sub-h">${d}</p>`+Object.keys(FIGHTS).filter(k=>FIGHTS[k].day===d)
      .map(k=>`<a href="?f=${k}">${FIGHTS[k].name}</a>`).join("")).join("")}</div>`;
}

F ? fightPage(F) : menu();

/* ---- the way back ---- */
document.addEventListener("click",e=>{
  if(!e.target.closest("[data-back]")) return;
  if(inRoS){ e.preventDefault(); window.parent.postMessage("combat-close",location.origin); return; }
  if(F){ try{ localStorage.setItem(POS,JSON.stringify({no:String(F.cue)})); }catch(err){} }
});
// inside the Run of Show its keys (cue sounds, next cue) keep working
if(inRoS) document.addEventListener("keydown",e=>{
  try{ window.parent.document.dispatchEvent(new KeyboardEvent("keydown",{key:e.key,code:e.code,shiftKey:e.shiftKey})); }catch(err){} });

// block pinch-zoom
document.addEventListener("touchmove",e=>{ if(e.scale && e.scale!==1) e.preventDefault(); },{passive:false});
</script>
</body>
</html>
