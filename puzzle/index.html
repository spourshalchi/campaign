<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clipping">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#191510">
<title>Torn Page — The Transyltown Crier</title>
<style>
  :root {
    --safe-top: env(safe-area-inset-top);
    --safe-bot: env(safe-area-inset-bottom);
    --safe-l: env(safe-area-inset-left);
    --safe-r: env(safe-area-inset-right);
    --paper: #e6dcc0;
    --ink: #17140f;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--paper);
    background:
      radial-gradient(ellipse at 50% 30%, #4a3220 0%, #1a0e08 75%),
      #1a0e08;
  }
  body {
    width: 100dvw; height: 100dvh;
    padding: var(--safe-top) var(--safe-r) var(--safe-bot) var(--safe-l);
    display: flex; flex-direction: column;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    opacity: 0.18;
    background:
      repeating-linear-gradient(92deg,
        rgba(255,220,180,0.05) 0 2px,
        transparent 2px 8px,
        rgba(0,0,0,0.06) 8px 9px,
        transparent 9px 14px);
  }

  /* ============== Splash ============== */
  #splash {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: calc(var(--safe-top) + 24px) 20px calc(var(--safe-bot) + 24px);
    z-index: 100;
    background: radial-gradient(ellipse at 50% 40%, #3a2618 0%, #100805 80%);
    text-align: center;
  }
  #splash .note {
    background: var(--paper);
    color: var(--ink);
    width: 100%; max-width: 380px;
    padding: 26px 22px 22px;
    box-shadow:
      0 10px 30px rgba(0,0,0,0.6),
      inset 0 0 60px rgba(120,80,40,0.12);
    transform: rotate(-1.2deg);
    border-radius: 1px;
    position: relative;
  }
  #splash .note::before, #splash .note::after {
    content: "";
    position: absolute;
    width: 70px; height: 18px;
    background: rgba(220,200,140,0.55);
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  #splash .note::before { top: -8px; left: -10px; transform: rotate(-8deg); }
  #splash .note::after  { top: -8px; right: -10px; transform: rotate(7deg); }
  #splash h1 {
    margin: 0 0 12px;
    font-size: 22px; font-weight: normal;
    letter-spacing: 0.04em;
    font-variant: small-caps;
  }
  #splash p {
    margin: 0 0 20px;
    font-size: 15px; line-height: 1.5;
    color: #4a3322;
  }
  #begin {
    appearance: none;
    background: var(--ink);
    color: var(--paper);
    border: 2px solid var(--ink);
    padding: 12px 28px;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    cursor: pointer;
    min-height: 48px; min-width: 160px;
    touch-action: manipulation;
  }
  #begin:active { background: #4a3322; }

  /* ============== Game shell ============== */
  #game {
    flex: 1 1 auto;
    width: 100%;
    display: flex; flex-direction: column;
    min-height: 0;
  }

  #hud {
    flex: 0 0 auto;
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: 8px 16px 6px;
  }
  #timer {
    font-family: "Courier New", monospace;
    font-size: 30px;
    letter-spacing: 0.08em;
    color: #f0e6c8;
    text-shadow: 0 0 12px rgba(255,180,100,0.3);
    padding: 4px 10px;
    cursor: pointer;
    touch-action: manipulation;
    min-width: 110px;
    text-align: center;
  }
  #timer.warning { color: #ffaa55; }
  #timer.critical {
    color: #ff5544;
    animation: pulse 0.6s steps(2) infinite;
  }
  @keyframes pulse { 50% { opacity: 0.55; } }

  #hint {
    font-size: 12px;
    color: #c8b896;
    opacity: 0.7;
    font-style: italic;
    margin-right: 8px;
  }

  /* ============== Workspace ============== */
  #workspace {
    flex: 1 1 auto;
    position: relative;
    width: 100%;
    min-height: 0;
    overflow: hidden;
  }

  #frame-hint {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 1px dashed rgba(244, 236, 214, 0.18);
    box-shadow: inset 0 0 50px rgba(0,0,0,0.4);
    pointer-events: none;
  }

  #pieces-layer {
    position: absolute;
    inset: 0;
    transition: opacity 0.7s ease;
  }
  #pieces-layer.faded {
    opacity: 0;
    pointer-events: none;
  }

  .piece {
    position: absolute;
    top: 0; left: 0;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    background-color: #e2d8bd;
    will-change: transform;
    touch-action: none;
    cursor: grab;
    -webkit-filter: drop-shadow(0 3px 5px rgba(0,0,0,0.55));
    filter: drop-shadow(0 3px 5px rgba(0,0,0,0.55));
  }
  .piece.dragging {
    cursor: grabbing;
    -webkit-filter: drop-shadow(0 8px 14px rgba(0,0,0,0.75));
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.75));
  }
  .piece.snapping {
    transition: transform 0.32s cubic-bezier(.3, 1.4, .5, 1);
  }
  .piece.locked { cursor: default; }

  .piece .flash {
    position: absolute; inset: 0;
    background: #fff5d8;
    opacity: 0;
    pointer-events: none;
  }
  .piece.lock-flash .flash {
    animation: lockFlash 0.6s ease-out;
  }
  @keyframes lockFlash {
    0%   { opacity: 0; }
    30%  { opacity: 0.55; }
    100% { opacity: 0; }
  }

  /* ============== Photo card (post-restoration) ============== */
  #photo-anchor {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    perspective: 1400px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.7s ease;
  }
  #photo-anchor.show {
    opacity: 1;
    pointer-events: auto;
  }
  #photo-card {
    position: relative;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transform: rotateY(0deg);
    transition: transform 0.45s cubic-bezier(.4,.05,.4,1);
    will-change: transform;
    cursor: grab;
    touch-action: none;
  }
  #photo-card.dragging {
    transition: none;
    cursor: grabbing;
  }
  #photo-card.wobble {
    animation: wobble 1.6s ease-in-out 1;
  }
  @keyframes wobble {
    0%, 100% { transform: rotateY(0deg); }
    25%      { transform: rotateY(-14deg); }
    65%      { transform: rotateY(10deg); }
  }
  #photo-card .face {
    position: absolute; inset: 0;
    background-size: 100% 100%;
    background-position: center;
    background-repeat: no-repeat;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow:
      0 10px 28px rgba(0,0,0,0.65),
      0 0 0 4px rgba(244, 236, 214, 0.04);
  }
  #photo-card .face.back {
    transform: rotateY(180deg);
    background-color: #e2d8bd;
    overflow: hidden;
  }
  /* Page 2 is longer than the card, so it gets clipped at the bottom edge.
     Fade it out so that reads as "the column continues" rather than as a
     rendering glitch. */
  #photo-card .face.back::after {
    content: "";
    position: absolute; left: 0; right: 0; bottom: 0;
    height: 70px;
    pointer-events: none;
    background: linear-gradient(to bottom, rgba(226,216,189,0), #e2d8bd 88%);
  }
  /* The back face renders page 2 shrunk to card size. It is deliberately
     too small to read -- that is what sends the player into the reader. */
  #page2-mini {
    position: absolute; top: 0; left: 0;
    transform-origin: top left;   /* width + scale set by fitPage2Mini() */
    pointer-events: none;
  }

  /* ============== Reader (fullscreen page 2) ============== */
  /* Kept as a flat 2D overlay, deliberately outside the 3D flip card:
     scrolling text inside a preserve-3d subtree is unreliable on iOS. */
  #reader {
    position: fixed; inset: 0;
    z-index: 160;
    display: none;
    /* No backdrop-filter here on purpose: blurring behind a full-screen
       scrolling overlay forces a re-composite per frame on iOS and stutters
       on older iPads. The flat alpha does the job. */
    background: rgba(10,7,4,0.86);
    opacity: 0;
    transition: opacity 0.5s ease;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding:
      calc(var(--safe-top) + 18px) calc(var(--safe-r) + 16px)
      calc(var(--safe-bot) + 40px) calc(var(--safe-l) + 16px);
  }
  #reader.show { display: block; opacity: 1; }

  #reader-sheet {
    position: relative;
    width: 100%; max-width: 660px;
    margin: 0 auto;
    background:
      radial-gradient(ellipse 60% 40% at 15% 8%,   rgba(150,120,70,0.10), transparent 70%),
      radial-gradient(ellipse 50% 30% at 88% 62%,  rgba(140,110,60,0.12), transparent 70%),
      linear-gradient(177deg, #ece3ca 0%, #e5dbc0 55%, #ddd2b3 100%);
    color: var(--ink);
    padding: 26px 26px 34px;
    box-shadow: 0 18px 50px rgba(0,0,0,0.7);
    -webkit-user-select: text; user-select: text;
  }
  #reader-sheet::after {
    content: "";
    position: absolute; inset: 0;
    pointer-events: none;
    opacity: 0.3;
    background:
      repeating-linear-gradient(94deg, rgba(90,70,40,0.05) 0 1px, transparent 1px 4px),
      radial-gradient(circle 8px at 12% 18%, rgba(120,85,40,0.35), transparent 72%),
      radial-gradient(circle 5px at 84% 44%, rgba(120,85,40,0.4), transparent 70%),
      radial-gradient(circle 11px at 68% 88%, rgba(110,80,38,0.3), transparent 74%);
  }

  #reader-close {
    position: sticky; top: 0; float: right;
    appearance: none;
    background: var(--ink); color: var(--paper);
    border: none;
    width: 44px; height: 44px;
    font-family: inherit; font-size: 22px; line-height: 1;
    cursor: pointer; z-index: 3;
    margin: -8px -8px 0 8px;
    touch-action: manipulation;
  }
  #reader-close:active { background: #4a3322; }

  /* ---------- shared page-2 newsprint styling ---------- */
  .page2 {
    font-family: "Times New Roman", Times, Georgia, serif;
    color: var(--ink);
    line-height: 1.5;
  }
  .page2 .folio {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; letter-spacing: 0.13em; text-transform: uppercase;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 6px; margin-bottom: 16px;
  }
  .page2 h2 {
    font-size: 30px; line-height: 1.08;
    font-weight: normal; letter-spacing: 0.01em;
    margin: 0 0 4px;
  }
  .page2 .contd {
    font-style: italic; font-size: 15px;
    padding-bottom: 10px; margin-bottom: 12px;
    border-bottom: 1px solid rgba(23,20,15,0.5);
  }
  .page2 p { margin: 0 0 9px; font-size: 17px; text-indent: 1.4em; }
  .page2 p:first-of-type { text-indent: 0; }
  .page2 p.q {
    text-indent: 0; font-style: italic;
    padding: 4px 0 4px 16px;
    border-left: 3px solid rgba(23,20,15,0.45);
    margin: 12px 0;
  }
  .page2 p.big {
    text-indent: 0; text-align: center;
    font-size: 20px; font-style: italic;
    padding: 12px 10px; margin: 14px 0;
    border-top: 1px solid rgba(23,20,15,0.5);
    border-bottom: 1px solid rgba(23,20,15,0.5);
  }
  .page2 .sub {
    text-align: center;
    font-family: "Bodoni 72 Smallcaps", Didot, Georgia, serif;
    font-size: 14px; letter-spacing: 0.16em; text-transform: uppercase;
    margin: 20px 0 10px;
  }
  .page2 .sub::before { content: "\2014\2003"; }
  .page2 .sub::after  { content: "\2003\2014"; }
  .page2 .box {
    border: 2px solid var(--ink);
    padding: 15px 16px 13px;
    margin-top: 26px;
    background: rgba(255,250,235,0.28);
  }
  .page2 .box .bt {
    font-family: "Bodoni 72 Smallcaps", Didot, Georgia, serif;
    font-size: 15px; letter-spacing: 0.13em; text-transform: uppercase;
    text-align: center; margin-bottom: 9px;
    padding-bottom: 7px;
    border-bottom: 1px solid rgba(23,20,15,0.4);
  }
  .page2 .box p { font-size: 16px; }
  .page2 .drop::first-letter {
    font-family: Didot, "Big Caslon", Georgia, serif;
    font-size: 52px; line-height: 0.8;
    float: left; padding: 5px 7px 0 0;
  }

  #photo-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255,220,150,0.55) 0%, rgba(255,180,80,0) 65%);
    opacity: 0;
    mix-blend-mode: screen;
  }
  #photo-glow.flash {
    animation: photoGlow 1.2s ease-out;
  }
  @keyframes photoGlow {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    35%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); }
  }

  #flip-hint {
    position: absolute;
    bottom: 22px; left: 50%;
    transform: translateX(-50%);
    color: #d8c8a8;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.6s ease;
    pointer-events: none;
    text-align: center;
    white-space: nowrap;
  }
  #flip-hint.show { opacity: 0.85; }
  #flip-hint .arrow {
    display: inline-block;
    margin-left: 6px;
    animation: hintBob 1.6s ease-in-out infinite;
  }
  @keyframes hintBob {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(6px); }
  }

  /* ============== Debug ============== */
  #debug {
    position: fixed;
    top: calc(var(--safe-top) + 8px);
    right: calc(var(--safe-r) + 8px);
    z-index: 200;
    background: rgba(20,12,8,0.92);
    border: 1px solid #5a3a20;
    color: #f0e6c8;
    padding: 10px;
    font-family: "Courier New", monospace;
    font-size: 12px;
    display: none;
    flex-direction: column;
    gap: 6px;
    min-width: 200px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.6);
  }
  #debug.open { display: flex; }
  #debug .row {
    display: flex; gap: 6px;
    align-items: center; justify-content: space-between;
  }
  #debug .label { opacity: 0.75; font-size: 11px; }
  #debug button {
    appearance: none;
    background: #2a1a10;
    color: #f0e6c8;
    border: 1px solid #5a3a20;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    min-height: 36px;
    flex: 1;
    touch-action: manipulation;
  }
  #debug button:active { background: #4a3322; }
  #debug .close {
    align-self: flex-end;
    flex: 0 0 auto;
    padding: 2px 8px;
    min-height: 0;
    font-size: 14px;
    line-height: 1;
  }

  /* ============== Fail ============== */
  #fail {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
    gap: 20px;
    z-index: 150;
    padding: 24px;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.95) 80%);
    opacity: 0;
    transition: opacity 1.2s ease;
    text-align: center;
  }
  #fail.show { display: flex; opacity: 1; }
  #fail h2 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #d8a878;
    font-weight: normal;
  }
  #fail p {
    margin: 0;
    color: #b8a890;
    font-style: italic;
    max-width: 420px;
    line-height: 1.5;
    font-size: 15px;
  }
  #retry {
    appearance: none;
    background: transparent;
    color: var(--paper);
    border: 1px solid #5a3a20;
    padding: 10px 22px;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    min-height: 44px;
    touch-action: manipulation;
  }
  #retry:active { background: rgba(255,255,255,0.08); }
</style>
</head>
<body>

<!-- ===== Splash ===== -->
<div id="splash">
  <div class="note">
    <h1>A torn page</h1>
    <p>Someone tore this out of the bound volume.<br>The pieces are still in the drawer.<br><br>She's coming back.</p>
    <button id="begin">Begin</button>
  </div>
</div>

<!-- ===== Game ===== -->
<div id="game" hidden>
  <div id="hud">
    <div id="timer" aria-label="time remaining">3:00</div>
    <div id="hint">piece the page together</div>
  </div>
  <div id="workspace">
    <div id="frame-hint"></div>
    <div id="pieces-layer"></div>
    <div id="photo-glow"></div>
    <div id="photo-anchor">
      <div id="photo-card">
        <div class="face front"></div>
        <div class="face back"><div id="page2-mini" class="page2"></div></div>
      </div>
    </div>
    <div id="flip-hint"><span>swipe for page 2</span><span class="arrow">↔</span></div>
  </div>
</div>

<!-- ===== Reader — page 2 at readable size ===== -->
<div id="reader">
  <div id="reader-sheet">
    <button id="reader-close" aria-label="close">&times;</button>
    <div id="reader-body" class="page2"></div>
  </div>
</div>

<!-- ===== Debug ===== -->
<div id="debug">
  <div class="row">
    <span class="label">DEBUG</span>
    <button class="close" id="dbg-close">×</button>
  </div>
  <div class="row">
    <button id="dbg-add">+30s</button>
    <button id="dbg-sub">-30s</button>
  </div>
  <div class="row">
    <button id="dbg-add5">+5s</button>
    <button id="dbg-sub5">-5s</button>
  </div>
  <div class="row">
    <button id="dbg-solve">solve</button>
    <button id="dbg-rescatter">re-scatter</button>
  </div>
  <div class="row">
    <span class="label" id="dbg-info"></span>
  </div>
</div>

<!-- ===== Fail ===== -->
<div id="fail">
  <h2>Footsteps in the stacks</h2>
  <p>You sweep the pieces back into the drawer and slide it shut.</p>
  <button id="retry">Try Again</button>
</div>

<!-- ============================================================
     PAGE 2 ARTICLES
     ============================================================
     One <template> per clipping. The id is referenced by CLIPPINGS
     below. The same markup is mounted twice: shrunk onto the back of
     the flip card, and full-size in the reader overlay.

     This is plain HTML on purpose -- edit the copy between sessions
     without re-rendering any art.

     Classes: .sub (small-caps subhead) .q (indented quote)
              .big (boxed pull quote) .box (sidebar) .drop (drop cap)
     ============================================================ -->
<template id="article-heath">
  <div class="folio">
    <span>The Transyltown Crier</span>
    <span>Page Two</span>
    <span>Oct. 28, 1937</span>
  </div>

  <h2>CHILDREN</h2>
  <div class="contd">Continued from Page One</div>

  <p>&hellip;insensible since Tuesday. Dr. Emmerich Vance, who has attended all three, reports the same findings in each: the skin cold to the touch, the breath shallow, the pulse slow past counting, and upon the left side of the throat two punctures no wider than a pin, ringed in white.</p>

  <p class="q">&ldquo;They are not asleep,&rdquo; Dr. Vance said Wednesday. &ldquo;Sleep has a bottom to it. This does not.&rdquo;</p>

  <p>At the request of the Dood trustees, the village sent to Kinderhook for Mr. Joost Wiegman, called in the Dutch fashion a <i>duivelbanner</i> &mdash; a banisher of devils &mdash; whose family has kept the old offices since before the patents.</p>

  <div class="sub">Upon the Heath</div>

  <p>Mr. Wiegman walked the heath at first light Wednesday and stopped some forty rods below the Dood house, where the ground had settled. Men were set to digging.</p>

  <p>At a depth of three feet they uncovered a coffin of no great age, and within it a body neither swollen nor spoiled, the cheeks full and the mouth wet.</p>

  <p class="big">&ldquo;This is the evil that has been found upon the heath.&rdquo;</p>

  <p>He directed that the body be lifted into the new coffin, and that a splinter of whitethorn be set into the underside of the lid, positioned so that its point stood directly above the heart. The lid was then nailed down. Six men held it.</p>

  <p>Those present report a howling and a wailing from inside the box that continued a quarter of an hour and was heard as far as the Vlietberg turn. When it stopped, the coffin was returned to the ground and covered over.</p>

  <div class="sub">The Children Woke</div>

  <p>All three opened their eyes before supper. Dr. Vance, who examined them within the hour, reports the marks upon their throats already closing, and expects a full recovery in each case.</p>

  <p>Mr. Wiegman declined the village&rsquo;s payment. He would say only that the work was not finished.</p>

  <p>Asked to explain himself, he said that the ground below the Dood house holds more than one such box; that he had found three and opened one; and that he would not go up to the house itself, not for any money the trustees cared to raise.</p>

  <p class="q">&ldquo;The rest are not on the heath,&rdquo; he said. &ldquo;They are under the chapel floor. And they are not asleep either.&rdquo;</p>

  <p>Mr. Wiegman left the village before dark and is not expected to return. The Dood house has stood shuttered since 1904. The trustees have declined to comment upon his statement.</p>

  <div class="box">
    <div class="bt">The Builder&rsquo;s Stone</div>
    <p>Readers who walk the Vlietberg heath will know the single marker standing apart from the family plot, some yards inside the treeline. It bears no name and no date, only a line of characters cut in a foreign hand, which the late Rev. Ackerman took for Norse and not Dutch, and which he declined to translate for this paper.</p>
    <p>It is said in the village that Cornelis Dood, who built the house and lived in it forty years without wife or child or company, was laid in the ground by men who took great care with <i>how</i> it was done &mdash; and that the care was not taken for his sake, but for theirs.</p>
  </div>
</template>

<script>
"use strict";

// ============================================================
// CONFIG — tweak between sessions
// ============================================================
// Each clipping is a torn front page plus the page-2 article behind it.
// To add another: render a new front image (see assets/render-front.sh),
// add a <template> above, add an entry here, then point ACTIVE at it.
const CLIPPINGS = {
  heath: {
    front:   "assets/front-heath.jpg",
    article: "article-heath",
  },
};

// Which clipping this session is running.
const ACTIVE = "heath";

const CONFIG = {
  // Grid is N x N. Total pieces = N*N.
  // Common values: 3 (easy), 4 (medium), 5 (hard).
  TILE_COUNT: 4,

  // Total seconds on the clock.
  TIME_SECONDS: 180,

  // Snap tuning.
  SNAP_DISTANCE_PX: 38,   // how close (in pixels) before a piece locks in

  // Tear-edge tuning.
  EDGE_SEGMENTS: 6,       // number of jitter points per seam (more = more ragged)
  EDGE_JITTER_FRAC: 0.16, // jitter relative to cell size (0..0.4 reasonable)

  // Initial scatter rotation range, in degrees.
  SCATTER_ROT_DEG: 14,

  // Frame sizing. The page is portrait, so HEIGHT is the binding
  // constraint -- capping width (as the photo version did) renders it
  // tiny on a landscape iPad.
  FRAME_MAX_W_FRAC: 0.62,
  FRAME_MAX_H_FRAC: 0.82,
  FRAME_MAX_H_PX:   680,

  // Design width the page-2 article is authored against, used to scale
  // it down onto the back of the card.
  ARTICLE_WIDTH_PX: 660,

  // How long after the card settles on the back before page 2 opens.
  READER_AUTO_MS: 620,
};

// ============================================================
// State
// ============================================================
const N = CONFIG.TILE_COUNT;
const TOTAL = N * N;

const clipping   = CLIPPINGS[ACTIVE];
const frontImage = clipping.front;
// Default aspect (portrait broadsheet) used until the real image resolves.
let imgW = 1240, imgH = 1748;
let frameW = 0, frameH = 0;    // render dimensions of the photo frame in workspace
let cellW = 0, cellH = 0;      // per-piece cell size in pixels

let pieces = [];               // array of piece objects
let lockedCount = 0;
let timeLeft = CONFIG.TIME_SECONDS;
let timerId = null;
let started = false;
let ended = false;
let restored = false;          // photo-card revealed after success

// Drag state
let dragging = null;
let dragOffset = { x: 0, y: 0 };

// Flip state
let flipBaseAngle = 0;
let flipDragStartX = 0;
let flipDragging = false;
let flipFirstUserAction = true;
let readerAutoShown = false;   // page 2 auto-opens once, on the first flip
let readerTimer = null;

// Element refs
const $splash = document.getElementById("splash");
const $game = document.getElementById("game");
const $timer = document.getElementById("timer");
const $hint = document.getElementById("hint");
const $workspace = document.getElementById("workspace");
const $frameHint = document.getElementById("frame-hint");
const $piecesLayer = document.getElementById("pieces-layer");
const $photoAnchor = document.getElementById("photo-anchor");
const $photoCard = document.getElementById("photo-card");
const $photoFront = $photoCard.querySelector(".face.front");
const $photoBack  = $photoCard.querySelector(".face.back");
const $photoGlow = document.getElementById("photo-glow");
const $flipHint = document.getElementById("flip-hint");
const $page2Mini = document.getElementById("page2-mini");
const $reader = document.getElementById("reader");
const $readerBody = document.getElementById("reader-body");
const $debug = document.getElementById("debug");
const $dbgInfo = document.getElementById("dbg-info");
const $fail = document.getElementById("fail");

// ============================================================
// Image loading + dimension probe
// ============================================================
function probeImage(src) {
  return new Promise((resolve) => {
    const im = new Image();
    im.onload = () => resolve({ ok: true, w: im.naturalWidth, h: im.naturalHeight });
    im.onerror = () => resolve({ ok: false, w: 0, h: 0 });
    im.src = src;
  });
}

async function resolveImages() {
  // Probe only to learn natural dimensions for layout. If probing fails
  // (e.g. inside a sandboxed preview), keep the default portrait ratio —
  // the pieces still render the real image via background-image.
  const f = await probeImage(frontImage);
  if (f.ok && f.w > 0 && f.h > 0) {
    imgW = f.w; imgH = f.h;
  }
}

// ============================================================
// Page 2 — mounted twice from one <template>
// ============================================================
function mountArticle() {
  const tpl = document.getElementById(clipping.article);
  if (!tpl) return;
  $readerBody.replaceChildren(tpl.content.cloneNode(true));
  $page2Mini.replaceChildren(tpl.content.cloneNode(true));
}

// Shrink the full-size article onto the back of the card. It ends up far
// too small to read, which is the point — it reads as a dense page of
// newsprint and sends the player into the reader.
function fitPage2Mini() {
  const k = frameW / CONFIG.ARTICLE_WIDTH_PX;
  $page2Mini.style.width = CONFIG.ARTICLE_WIDTH_PX + "px";
  $page2Mini.style.transform = `scale(${k})`;
  // Pad so the shrunken column doesn't run to the very edge of the card.
  $page2Mini.style.padding = Math.round(22 / k) + "px";
}

// ============================================================
// Layout — frame size based on workspace + image aspect
// ============================================================
function computeLayout() {
  const ws = $workspace.getBoundingClientRect();
  const aspect = imgW / imgH;
  // Frame should leave some perimeter room for scattered pieces.
  const maxW = ws.width  * CONFIG.FRAME_MAX_W_FRAC;
  const maxH = ws.height * CONFIG.FRAME_MAX_H_FRAC;
  let w = maxW, h = w / aspect;
  if (h > maxH) { h = maxH; w = h * aspect; }
  // Hard cap so it doesn't go silly on huge screens. The page is portrait,
  // so this caps HEIGHT — capping width would shrink it to nothing.
  if (h > CONFIG.FRAME_MAX_H_PX) { h = CONFIG.FRAME_MAX_H_PX; w = h * aspect; }
  frameW = Math.floor(w);
  frameH = Math.floor(h);
  cellW = frameW / N;
  cellH = frameH / N;

  // Position the dashed target hint
  $frameHint.style.width  = frameW + "px";
  $frameHint.style.height = frameH + "px";

  // Photo card sits at frame center after restoration
  $photoAnchor.style.width  = frameW + "px";
  $photoAnchor.style.height = frameH + "px";
  $photoFront.style.backgroundImage = `url("${frontImage}")`;
  fitPage2Mini();

  $photoGlow.style.width  = (frameW * 1.1) + "px";
  $photoGlow.style.height = (frameH * 1.1) + "px";
}

function frameOriginInWorkspace() {
  // Top-left of the photo frame within the workspace.
  const wsRect = $workspace.getBoundingClientRect();
  return {
    x: (wsRect.width  - frameW) / 2,
    y: (wsRect.height - frameH) / 2,
  };
}

// ============================================================
// Tear-edge generation
// ============================================================
// Generate a jagged polyline from start to end, with jitter perpendicular to the line.
function generateSeam(start, end, segments, jitter) {
  const pts = [{ x: start.x, y: start.y }];
  const dx = end.x - start.x;
  const dy = end.y - start.y;
  const len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len, ny = dx / len; // perpendicular unit vector
  for (let i = 1; i < segments; i++) {
    const t = i / segments;
    const baseX = start.x + dx * t;
    const baseY = start.y + dy * t;
    const j = (Math.random() - 0.5) * 2 * jitter;
    pts.push({ x: baseX + nx * j, y: baseY + ny * j });
  }
  pts.push({ x: end.x, y: end.y });
  return pts;
}

// Build N+1 rows of horizontal seams and N+1 cols of vertical seams.
// Outer edges stay straight; internal edges are jagged but shared between neighbors.
function buildSeams() {
  const segs = CONFIG.EDGE_SEGMENTS;
  const jitter = Math.min(cellW, cellH) * CONFIG.EDGE_JITTER_FRAC;

  const hSeams = []; // hSeams[r][c] = points for top edge of cell (r,c)
  for (let r = 0; r <= N; r++) {
    hSeams.push([]);
    for (let c = 0; c < N; c++) {
      const a = { x: c * cellW,       y: r * cellH };
      const b = { x: (c + 1) * cellW, y: r * cellH };
      hSeams[r].push(
        (r === 0 || r === N) ? [a, b] : generateSeam(a, b, segs, jitter)
      );
    }
  }

  const vSeams = []; // vSeams[r][c] = points for left edge of cell (r,c)
  for (let r = 0; r < N; r++) {
    vSeams.push([]);
    for (let c = 0; c <= N; c++) {
      const a = { x: c * cellW, y: r * cellH };
      const b = { x: c * cellW, y: (r + 1) * cellH };
      vSeams[r].push(
        (c === 0 || c === N) ? [a, b] : generateSeam(a, b, segs, jitter)
      );
    }
  }
  return { hSeams, vSeams };
}

// Construct each piece's polygon by walking top → right → bottom → left.
function buildPolygons(hSeams, vSeams) {
  const polys = [];
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const top    = hSeams[r][c];      // L→R
      const right  = vSeams[r][c + 1];  // T→B
      const bottom = hSeams[r + 1][c];  // L→R (will reverse)
      const left   = vSeams[r][c];      // T→B (will reverse)

      const poly = [];
      // Top edge: include all points
      for (const p of top) poly.push(p);
      // Right edge: skip first (overlaps with top end)
      for (let i = 1; i < right.length; i++) poly.push(right[i]);
      // Bottom edge in reverse: skip its last point (overlaps with right end)
      for (let i = bottom.length - 2; i >= 0; i--) poly.push(bottom[i]);
      // Left edge in reverse: skip its last (= bottom's first) and first (= top's first)
      for (let i = left.length - 2; i >= 1; i--) poly.push(left[i]);

      polys.push(poly);
    }
  }
  return polys;
}

function polygonToClipPath(poly) {
  return "polygon(" + poly.map((p) => `${p.x.toFixed(2)}px ${p.y.toFixed(2)}px`).join(", ") + ")";
}

// ============================================================
// Pieces
// ============================================================
function buildPieces() {
  $piecesLayer.innerHTML = "";
  pieces = [];
  lockedCount = 0;

  const { hSeams, vSeams } = buildSeams();
  const polys = buildPolygons(hSeams, vSeams);

  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const idx = r * N + c;
      const poly = polys[idx];

      const el = document.createElement("div");
      el.className = "piece";
      el.style.width  = frameW + "px";
      el.style.height = frameH + "px";
      el.style.backgroundImage = `url("${frontImage}")`;
      el.style.clipPath = polygonToClipPath(poly);
      el.style.webkitClipPath = polygonToClipPath(poly);
      // Rotate around the polygon's center so spinning feels natural
      const cx = c * cellW + cellW / 2;
      const cy = r * cellH + cellH / 2;
      el.style.transformOrigin = `${cx}px ${cy}px`;

      const flash = document.createElement("div");
      flash.className = "flash";
      el.appendChild(flash);

      const piece = {
        id: idx, r, c,
        polyCenter: { x: cx, y: cy },
        // x, y is the piece div's translate (workspace coords for top-left of full frame-sized div)
        x: 0, y: 0, rot: 0,
        locked: false, el,
      };

      el.addEventListener("pointerdown", (ev) => onPointerDown(ev, piece));
      $piecesLayer.appendChild(el);
      pieces.push(piece);
    }
  }
}

function applyTransform(p) {
  p.el.style.transform = `translate(${p.x}px, ${p.y}px) rotate(${p.rot}deg)`;
}

function correctPosFor(p) {
  // Piece div's correct top-left within workspace = frame top-left in workspace.
  const o = frameOriginInWorkspace();
  return { x: o.x, y: o.y };
}

function scatterPieces() {
  const ws = $workspace.getBoundingClientRect();
  const margin = 16;
  for (const p of pieces) {
    // Pick a random position for the piece's polygon center within the workspace.
    const minX = cellW / 2 + margin;
    const maxX = ws.width  - cellW / 2 - margin;
    const minY = cellH / 2 + margin;
    const maxY = ws.height - cellH / 2 - margin;
    const targetCx = minX + Math.random() * Math.max(1, maxX - minX);
    const targetCy = minY + Math.random() * Math.max(1, maxY - minY);
    // Convert center → piece div top-left (subtract polygon-center offset).
    p.x = targetCx - p.polyCenter.x;
    p.y = targetCy - p.polyCenter.y;
    p.rot = (Math.random() - 0.5) * 2 * CONFIG.SCATTER_ROT_DEG;
    p.locked = false;
    p.el.classList.remove("locked", "snapping", "lock-flash");
    p.el.style.zIndex = String(10 + Math.floor(Math.random() * 50));
    applyTransform(p);
  }
  lockedCount = 0;
}

function snapToCorrect(p) {
  const c = correctPosFor(p);
  p.x = c.x; p.y = c.y; p.rot = 0;
  p.locked = true;
  p.el.classList.add("snapping", "locked", "lock-flash");
  p.el.style.zIndex = String(p.r * N + p.c); // back-to-front by row/col
  applyTransform(p);
  // remove transition after it finishes so dragging others feels snappy
  setTimeout(() => p.el.classList.remove("snapping"), 350);
  setTimeout(() => p.el.classList.remove("lock-flash"), 600);
  lockedCount++;
  if (lockedCount >= TOTAL && !ended) onWin();
}

// ============================================================
// Drag
// ============================================================
function onPointerDown(ev, p) {
  if (!started || ended || p.locked) return;
  ev.preventDefault();
  dragging = p;
  p.el.setPointerCapture(ev.pointerId);
  p.el.classList.add("dragging");
  p.el.classList.remove("snapping");
  p.el.style.zIndex = "9999";
  const wsRect = $workspace.getBoundingClientRect();
  const px = ev.clientX - wsRect.left;
  const py = ev.clientY - wsRect.top;
  dragOffset = { x: px - p.x, y: py - p.y };
  document.addEventListener("pointermove", onPointerMove, { passive: false });
  document.addEventListener("pointerup", onPointerUp, { passive: false });
  document.addEventListener("pointercancel", onPointerUp, { passive: false });
}

function onPointerMove(ev) {
  if (!dragging) return;
  ev.preventDefault();
  const wsRect = $workspace.getBoundingClientRect();
  const px = ev.clientX - wsRect.left;
  const py = ev.clientY - wsRect.top;
  dragging.x = px - dragOffset.x;
  dragging.y = py - dragOffset.y;
  // Slight self-righting while dragging
  dragging.rot *= 0.92;
  applyTransform(dragging);
}

function onPointerUp(ev) {
  if (!dragging) return;
  const p = dragging;
  dragging = null;
  document.removeEventListener("pointermove", onPointerMove);
  document.removeEventListener("pointerup", onPointerUp);
  document.removeEventListener("pointercancel", onPointerUp);
  p.el.classList.remove("dragging");
  if (ev.pointerId !== undefined) {
    try { p.el.releasePointerCapture(ev.pointerId); } catch {}
  }

  // Snap test: distance between piece's polygon center and where it should be
  const correct = correctPosFor(p);
  const pieceCenterX = p.x + p.polyCenter.x;
  const pieceCenterY = p.y + p.polyCenter.y;
  const targetCenterX = correct.x + p.polyCenter.x;
  const targetCenterY = correct.y + p.polyCenter.y;
  const dist = Math.hypot(pieceCenterX - targetCenterX, pieceCenterY - targetCenterY);
  if (dist <= CONFIG.SNAP_DISTANCE_PX) {
    snapToCorrect(p);
  } else {
    // Just settle in place with a small relax
    p.el.classList.add("snapping");
    setTimeout(() => p.el.classList.remove("snapping"), 320);
    applyTransform(p);
  }
}

// ============================================================
// Timer
// ============================================================
function fmt(s) {
  s = Math.max(0, Math.floor(s));
  const m = Math.floor(s / 60);
  const r = s % 60;
  return `${m}:${String(r).padStart(2, "0")}`;
}

function paintTimer() {
  $timer.textContent = fmt(timeLeft);
  $timer.classList.toggle("critical", timeLeft <= 10);
  $timer.classList.toggle("warning", timeLeft > 10 && timeLeft <= 30);
  if ($debug.classList.contains("open")) {
    $dbgInfo.textContent = `t=${timeLeft}s · ${N}x${N} · locked=${lockedCount}/${TOTAL}`;
  }
}

function startTimer() {
  if (timerId) clearInterval(timerId);
  timerId = setInterval(() => {
    if (ended) return;
    timeLeft--;
    paintTimer();
    if (timeLeft <= 0) {
      timeLeft = 0;
      paintTimer();
      onFail();
    }
  }, 1000);
}

function stopTimer() {
  if (timerId) clearInterval(timerId);
  timerId = null;
}

function adjustTime(delta) {
  timeLeft = Math.max(0, timeLeft + delta);
  paintTimer();
}

// ============================================================
// Win — restoration animation + flip enable
// ============================================================
function onWin() {
  if (ended) return;
  ended = true;
  stopTimer();

  // Tiny pause so the final snap is felt.
  setTimeout(() => {
    // Glow flash at the photo
    $photoGlow.classList.remove("flash");
    void $photoGlow.offsetWidth; // restart animation
    $photoGlow.classList.add("flash");

    // Cross-fade pieces out, photo card in
    setTimeout(() => {
      $piecesLayer.classList.add("faded");
      $photoAnchor.classList.add("show");
    }, 250);

    // After the fade, wobble the card and show the swipe hint
    setTimeout(() => {
      $photoCard.classList.add("wobble");
      restored = true;
      enableFlipDrag();
    }, 1100);

    setTimeout(() => {
      $flipHint.classList.add("show");
    }, 1700);
  }, 300);
}

// ============================================================
// Flip handlers — horizontal swipe rotates around Y axis
// ============================================================
function flipPointerDown(ev) {
  if (!restored) return;
  ev.preventDefault();
  flipDragging = true;
  flipDragStartX = ev.clientX;
  $photoCard.classList.add("dragging");
  $photoCard.classList.remove("wobble");
  try { $photoCard.setPointerCapture(ev.pointerId); } catch {}
  document.addEventListener("pointermove", flipPointerMove, { passive: false });
  document.addEventListener("pointerup", flipPointerUp, { passive: false });
  document.addEventListener("pointercancel", flipPointerUp, { passive: false });
}

function flipPointerMove(ev) {
  if (!flipDragging) return;
  ev.preventDefault();
  const dx = ev.clientX - flipDragStartX;
  // 1.0 of width = 180deg of rotation
  const angle = flipBaseAngle + (dx / Math.max(1, frameW)) * 180;
  $photoCard.style.transform = `rotateY(${angle}deg)`;
}

function flipPointerUp(ev) {
  if (!flipDragging) return;
  flipDragging = false;
  document.removeEventListener("pointermove", flipPointerMove);
  document.removeEventListener("pointerup", flipPointerUp);
  document.removeEventListener("pointercancel", flipPointerUp);
  $photoCard.classList.remove("dragging");
  const dx = ev.clientX - flipDragStartX;
  const swept = (dx / Math.max(1, frameW)) * 180;
  let newBase = flipBaseAngle;
  // Threshold: swept ~50deg = commit a flip. Otherwise spring back.
  if (swept >  50) newBase = flipBaseAngle + 180;
  if (swept < -50) newBase = flipBaseAngle - 180;

  // A tap (rather than a drag) on the back re-opens page 2 after the
  // player has closed it.
  const wasTap = Math.abs(dx) < 8;
  if (wasTap && showingBack()) openReader();

  flipBaseAngle = newBase;
  $photoCard.style.transform = `rotateY(${newBase}deg)`;
  // Once user has interacted, fade out the hint
  if (flipFirstUserAction) {
    flipFirstUserAction = false;
    $flipHint.classList.remove("show");
  }
  scheduleReaderAuto();
}

// ============================================================
// Reader
// ============================================================
// True when the card has settled with its back toward the player.
function showingBack() {
  const a = ((flipBaseAngle % 360) + 360) % 360;
  return a > 90 && a < 270;
}

// The first time the card comes to rest on the back, open page 2 by
// itself — that reveal is the whole payoff, it shouldn't need a second
// gesture to find.
function scheduleReaderAuto() {
  if (readerAutoShown || !showingBack()) return;
  readerAutoShown = true;
  if (readerTimer) clearTimeout(readerTimer);
  readerTimer = setTimeout(openReader, CONFIG.READER_AUTO_MS);
}

function openReader() {
  $reader.classList.add("show");
  $reader.scrollTop = 0;
  $flipHint.classList.remove("show");
}

function closeReader() {
  $reader.classList.remove("show");
}

function enableFlipDrag() {
  $photoCard.addEventListener("pointerdown", flipPointerDown);
}
function disableFlipDrag() {
  $photoCard.removeEventListener("pointerdown", flipPointerDown);
}

// ============================================================
// Fail — crumble pieces, show retry
// ============================================================
function onFail() {
  if (ended) return;
  ended = true;
  stopTimer();
  crumble();
  setTimeout(() => $fail.classList.add("show"), 1700);
}

function crumble() {
  for (const p of pieces) {
    const dx  = (Math.random() - 0.5) * 700;
    const dy  = 500 + Math.random() * 500;
    const rot = (Math.random() - 0.5) * 720;
    const delay = Math.random() * 600;
    p.el.style.transition = `transform 1.6s cubic-bezier(.4,.05,.7,1) ${delay}ms, opacity 1.6s ease ${delay}ms`;
    p.el.style.transform  = `translate(${p.x + dx}px, ${p.y + dy}px) rotate(${p.rot + rot}deg)`;
    p.el.style.opacity    = "0";
  }
}

// ============================================================
// Debug — long-press timer to toggle
// ============================================================
let pressTimer = null;
(function armDebug(target) {
  const begin = () => {
    pressTimer = setTimeout(() => {
      $debug.classList.toggle("open");
      paintTimer();
      if (navigator.vibrate) navigator.vibrate(8);
    }, 1200);
  };
  const cancel = () => { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } };
  target.addEventListener("touchstart", begin, { passive: true });
  target.addEventListener("mousedown", begin);
  ["touchend", "touchcancel", "mouseup", "mouseleave"].forEach((ev) =>
    target.addEventListener(ev, cancel, { passive: true })
  );
})($timer);

document.getElementById("dbg-close").addEventListener("click", () => $debug.classList.remove("open"));
document.getElementById("dbg-add").addEventListener("click",  () => adjustTime(+30));
document.getElementById("dbg-sub").addEventListener("click",  () => adjustTime(-30));
document.getElementById("dbg-add5").addEventListener("click", () => adjustTime(+5));
document.getElementById("dbg-sub5").addEventListener("click", () => adjustTime(-5));
document.getElementById("dbg-solve").addEventListener("click", () => {
  if (ended) return;
  // Snap every remaining piece into place
  for (const p of pieces) {
    if (!p.locked) snapToCorrect(p);
  }
});
document.getElementById("dbg-rescatter").addEventListener("click", () => {
  if (ended) return;
  scatterPieces();
});

// ============================================================
// Start flow
// ============================================================
async function startGame() {
  mountArticle();
  await resolveImages();
  $splash.style.display = "none";
  $game.hidden = false;
  // Wait a frame so workspace has its real size
  await new Promise((r) => requestAnimationFrame(r));
  computeLayout();
  buildPieces();
  scatterPieces();
  timeLeft = CONFIG.TIME_SECONDS;
  paintTimer();
  started = true;
  ended = false;
  restored = false;
  flipBaseAngle = 0;
  flipFirstUserAction = true;
  readerAutoShown = false;
  if (readerTimer) { clearTimeout(readerTimer); readerTimer = null; }
  closeReader();
  $photoCard.style.transform = "rotateY(0deg)";
  $piecesLayer.classList.remove("faded");
  $photoAnchor.classList.remove("show");
  $photoCard.classList.remove("wobble");
  $flipHint.classList.remove("show");
  disableFlipDrag();
  startTimer();
}

document.getElementById("begin").addEventListener("click", startGame);
document.getElementById("reader-close").addEventListener("click", closeReader);
// Tapping the darkened surround closes page 2 too; taps on the sheet itself
// must not, or you can't select the text.
$reader.addEventListener("click", (e) => { if (e.target === $reader) closeReader(); });

document.getElementById("retry").addEventListener("click", () => {
  $fail.classList.remove("show");
  ended = false;
  // Rebuild fresh pieces (crumble mangled their inline styles)
  buildPieces();
  scatterPieces();
  timeLeft = CONFIG.TIME_SECONDS;
  paintTimer();
  startTimer();
});

// Block pinch-zoom on iOS
document.addEventListener("touchmove", (e) => {
  if (e.scale && e.scale !== 1) e.preventDefault();
}, { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());

// Initial paint (in case splash bypassed)
paintTimer();
</script>
</body>
</html>
