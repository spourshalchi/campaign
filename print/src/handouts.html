<!DOCTYPE html>
<!--
  PRINT: each player's handout: a good turn, what every feature and spell does, and what changes at level 5.
  No stat block: AC, hit points, scores, saves, skills and attacks are on each player's filled official sheet.
  Handed to one player only, so Simone's names her patron. The shared iPad page (characters/) leaves that out.
  One Letter sheet at a time, 1-sided, two columns with a gutter down the middle so it can fold in half.
  Each header prints the player's build link; print/build.py passes the site address as ?site=.
  PRINT ONLY: print/build.py puts these after the backstory reprint in print/8-player-handouts.pdf.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Handouts">
<meta name="theme-color" content="#14121a">
<title>Player Handouts</title>
<style>
  :root{ --f-type:"Courier New",Courier,monospace; --f-ui:"Helvetica Neue",Helvetica,Arial,sans-serif; --f-body:Georgia,"Times New Roman",serif; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:#14121a;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px;font-family:var(--f-body);color:#111;overscroll-behavior:none}
  .page{width:8.5in;height:11in;padding:.35in .4in;background:#fff;display:flex;flex-direction:column;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .hd{display:flex;align-items:baseline;gap:.1in;padding-bottom:.05in;border-bottom:3pt solid var(--a);margin-bottom:.1in}
  .hd h1{margin:0;white-space:nowrap;font:700 21pt/1 var(--f-type);color:var(--a)}
  .hd .who{flex:1;font:10pt/1.2 var(--f-ui);color:#333}
  .hd .pg{font:10pt/1.2 var(--f-ui);color:#333;white-space:nowrap}
  .hd .who b{display:block;white-space:nowrap;font:700 9pt/1.3 var(--f-type);color:var(--a)}
  .priv{margin:0 0 .08in;padding:.03in .08in;border:1.5pt solid var(--a);font:700 10pt/1.3 var(--f-ui);color:var(--a)}
  .colsw{flex:1;min-height:0;display:flex;gap:.4in}
  .col{flex:1;min-width:0;height:100%;overflow:hidden}
  h3{margin:0 0 .04in;font:700 10pt/1.2 var(--f-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--a)}
  .blk{margin:0 0 .08in}
  .card{padding:.04in .07in;border:1pt solid #555;border-radius:4pt}
  .card h4{margin:0;font:700 11pt/1.2 var(--f-type)}
  .meta{margin:0 0 .015in;font:8.5pt/1.25 var(--f-ui);color:#333}
  .card p{margin:0 0 .015in;font-size:9.5pt;line-height:1.24}
  .use b{color:var(--a)}
  .turn{padding:.06in .08in;border:2pt solid var(--a);border-radius:5pt}
  .turn h4{margin:0 0 .03in;font:700 12.5pt/1.2 var(--f-type);color:var(--a)}
  .turn ol,.ul{margin:0;padding-left:.17in;font-size:9.5pt;line-height:1.24}
  .turn li,.ul li{margin-bottom:.015in}
  .opt{font-size:9.5pt;line-height:1.24;margin:0 0 .03in}
  .opt b{font-family:var(--f-ui);font-size:9pt}
  @media print{
    @page{size:letter portrait;margin:0}
    body{background:#fff;padding:0;display:block}
    .page{break-after:page}
    .page:last-child{break-after:auto}
  }
</style>
</head>
<body>
<script>window.PRINT_MODE = true; const HANDOUTS = {}; function handout(id, data){ HANDOUTS[id] = data; }</script>
<script src="../../characters/engine.js"></script>
<script src="../../characters/gnomey.js"></script><script src="../../characters/bix.js"></script><script src="../../characters/yobo.js"></script><script src="../../characters/russ.js"></script><script src="../../characters/simone.js"></script>
<script src="handouts/gnomey.js"></script><script src="handouts/bix.js"></script><script src="handouts/yobo.js"></script><script src="handouts/russ.js"></script><script src="handouts/simone.js"></script>
<script>
"use strict";
const card = x => `<div class="card"><h4>${x.nm}</h4>${x.meta?`<p class="meta">${x.meta}</p>`:""}<p>${x.does}</p>${x.use?`<p class="use"><b>Use it when</b> ${x.use}</p>`:""}</div>`;
function blocks(pc, h){
  const t = h.turn, c5 = calc(pc,5), out = [];
  if(h.patronLine) out.push(`<p class="opt">${h.patronLine}</p>`);
  out.push(`<div class="turn"><h4>A good turn: ${t.title}</h4><ol>${t.steps.map(s=>`<li>${s}</li>`).join("")}</ol></div>`);
  out.push(`<h3>If things look different</h3>${t.options.slice(0,1).map(([a,b])=>`<p class="opt"><b>${a}:</b> ${b}</p>`).join("")}`);
  t.options.slice(1).forEach(([a,b])=>out.push(`<p class="opt"><b>${a}:</b> ${b}</p>`));
  out.push(`<h3>Bonus actions and reactions</h3><ul class="ul">${t.extras.map(s=>`<li>${s}</li>`).join("")}</ul>`);
  if(h.powersIntro) out.push(`<p class="opt">${h.powersIntro}</p>`);
  h.features.forEach((f,i)=>out.push((i?"":`<h3>Features</h3>`)+card(f)));
  (h.spells||[]).forEach(g=>g.list.forEach((x,i)=>out.push((i?"":`<h3>${g.h}</h3>${g.intro?`<p class="opt">${g.intro}</p>`:""}`)+card(x))));
  out.push(`<h3>At level 5: end of Saturday</h3><ul class="ul"><li>Proficiency +3: attacks, save DCs, proficient skills and saves go up by 1, Expertise skills by 2.</li><li>Hit points ${calc(pc,4).hp} &rarr; ${c5.hp}.${pc.spellAbility?` Spell attack ${sign(c5.spellAtk)}, save DC ${c5.spellDC}.`:""}</li>${h.level5.map(s=>`<li>${s}</li>`).join("")}</ul>`);
  (h.level5cards||[]).forEach(x=>out.push(card(x)));
  return out;
}
const body = document.body;
const SITE = new URLSearchParams(location.search).get("site");
ROSTER.forEach(([id,nm,player])=>{
  const pc = CHARACTERS[id], h = HANDOUTS[id], made = [];
  const newPage = () => {
    const p = document.createElement("div"); p.className="page"; p.style.setProperty("--a",pc.color);
    p.innerHTML = `<div class="hd"><h1>${nm}</h1><span class="who">${player} · level 4 · ${pc.tag}${SITE?`<b>${SITE}/characters/?p=${id}</b>`:""}</span><span class="pg"></span></div>`+
      (h.private?`<p class="priv">${h.private}</p>`:"")+
      `<div class="colsw"><div class="col"></div><div class="col"></div></div>`;
    body.appendChild(p); made.push(p); return p;
  };
  let page = newPage(), ci = 0, col = page.querySelectorAll(".col")[0];
  blocks(pc,h).forEach(html=>{
    const b = document.createElement("div"); b.className="blk"; b.innerHTML=html; col.appendChild(b);
    if(col.scrollHeight>col.clientHeight){
      b.remove();
      if(ci===0){ ci=1; }
      else { page=newPage(); ci=0; }
      col = page.querySelectorAll(".col")[ci]; col.appendChild(b);
    }
  });
  made.forEach((p,i)=>{ p.querySelector(".pg").textContent = `sheet ${i+1} of ${made.length}`; });
});
document.addEventListener("touchmove", e => { if (e.scale && e.scale !== 1) e.preventDefault(); }, {passive:false});
</script>
</body>
</html>
