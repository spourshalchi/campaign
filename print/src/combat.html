<!DOCTYPE html>
<!--
  PRINT: the combat cheat sheet, the paper backup for the Run of Show's fight cards if the iPad dies.
  One US Letter page per day (Saturday, Sunday): every stat strip, the "on its turn" lines, when it drops,
  and the fight's win / ends / losing lines, with boxes to tick HP by hand.
  Content comes from run/fights.js, the same file the Run of Show reads, so the two never drift.
  🟡 NOT CANON YET: every number (AI-made from SRD 5.2 creatures). Logged in CANON.md.
  PRINT ONLY: print/build.py renders it into print/7-combat.pdf. Plain paper, black and white is fine, 100%.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Combat Sheet">
<meta name="theme-color" content="#14121a">
<title>Combat Cheat Sheet</title>
<style>
  :root{ --in:11.7647cqi; --f:"Helvetica Neue",Helvetica,Arial,sans-serif; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:#14121a; min-height:100dvh; overscroll-behavior:none; font-family:var(--f);
    padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; gap:14px}
  .bar{width:100%; max-width:760px; color:#cfc8dc; font-size:14px; line-height:1.5; -webkit-user-select:none; user-select:none}
  .bar b{color:#fff}
  #pages{width:100%; display:flex; flex-direction:column; align-items:center; gap:14px}

  /* a Letter sheet: the type is sized in sheet inches so the screen view matches the print */
  .page{width:100%; max-width:760px; aspect-ratio:8.5/11; container-type:inline-size; background:#fff; color:#111;
    box-shadow:0 20px 44px rgba(0,0,0,.7); position:relative; overflow:hidden}
  .sheet{position:absolute; inset:calc(.45 * var(--in)) calc(.5 * var(--in)); font-size:calc(.112 * var(--in)); line-height:1.27}
  .sheet h1{margin:0 0 calc(.04 * var(--in)); font-size:calc(.2 * var(--in)); letter-spacing:.02em}
  .sheet .sub{margin:0 0 calc(.1 * var(--in)); color:#444; font-size:calc(.105 * var(--in))}
  .cols{column-count:2; column-gap:calc(.25 * var(--in)); column-fill:auto; height:calc(100% - .42 * var(--in))}
  .fight{break-inside:auto; margin:0 0 calc(.1 * var(--in))}
  .fight h2{margin:0 0 calc(.03 * var(--in)); font-size:calc(.14 * var(--in)); border-bottom:1.5px solid #111; padding-bottom:1px; break-after:avoid}
  .top{break-inside:avoid}
  .run{margin:0 0 calc(.05 * var(--in)); color:#222}
  .run div{margin:0 0 1px}
  .run .beats{margin:1px 0 2px; padding-left:.6em; border-left:2px solid #999}
  .run b, .k{font-size:.85em; letter-spacing:.06em; text-transform:uppercase}
  .foe{break-inside:avoid; border:1px solid #999; border-radius:4px; padding:calc(.04 * var(--in)) calc(.06 * var(--in)); margin:0 0 calc(.05 * var(--in))}
  .foe .h{display:flex; justify-content:space-between; gap:8px; align-items:baseline; font-weight:700}
  .foe .st{font-family:"SF Mono",Menlo,Consolas,monospace; font-weight:700; white-space:nowrap}
  .foe ol{margin:1px 0 0; padding-left:1.3em}
  .foe li{margin:0}
  .foe p{margin:1px 0 0}
  .foe .note{color:#333}
  .boxes{display:flex; flex-wrap:wrap; gap:2px 8px; margin-top:2px; font-size:.92em}
  .boxes span{display:inline-flex; align-items:center; gap:3px}
  .boxes i{display:inline-block; width:calc(.42 * var(--in)); height:calc(.14 * var(--in)); border:1px solid #555; border-radius:2px}
  .allies{break-inside:avoid; border:1px dashed #777; border-radius:4px; padding:calc(.04 * var(--in)) calc(.06 * var(--in)); margin:0 0 calc(.05 * var(--in))}
  .allies p{margin:1px 0 0}

  @media print{
    @page{size:letter portrait; margin:0}
    html,body{background:#fff !important}
    body{padding:0; display:block; min-height:0}
    .bar{display:none !important}
    #pages{display:block}
    .page{width:8.5in; height:11in; max-width:none; aspect-ratio:auto; box-shadow:none; break-after:page}
    .page:last-child{break-after:auto}
  }
</style>
</head>
<body>
<p class="bar"><b>Combat cheat sheet</b> · the paper backup for the Run of Show's fight cards. One Letter page per day, plain paper, 100%. Write HP in the boxes. 🟡 Every number is a draft.</p>
<div id="pages"></div>
<script src="../../run/fights.js"></script>
<script>
"use strict";
const DAYS = [
  {day:"Saturday", head:"Saturday · 5 PCs at level 4", keys:["library","contact","summoning"]},
  {day:"Sunday",   head:"Sunday · 5 PCs at level 5",   keys:["reserve","developer","booth"]}
];
const boxes = e => e.hp ? `<div class="boxes">${Array.from({length:e.n},(_,k)=>
  `<span>${e.n>1?k+1:"HP"} <i></i></span>`).join("")}</div>` : "";
const foe = e => `<div class="foe">
  <div class="h"><span>${e.nm}${e.n>1?` ×${e.n}`:""}</span><span class="st">AC ${e.ac} · HP ${e.hp||"—"} · ${e.spd}</span></div>
  <ol>${e.turn.map(t=>`<li>${t}</li>`).join("")}</ol>
  ${e.note?`<p class="note">${e.note}</p>`:""}
  <p><span class="k">Drops</span> ${e.drop}</p>
  ${boxes(e)}</div>`;
// with an allyJob line up top, the paper copy keeps only the ally lines it doesn't already say (Angelique's)
const allyBox = f => { if(!f.allies) return "";
  const list = f.run.allyJob ? f.allies.filter(a=>a.nm==="Angelique") : f.allies;
  if(!list.length) return "";
  return `<div class="allies"><span class="k">${f.run.allyJob?"Also":f.alliesLabel||"Allies"}</span>${list.map(a=>`<p><b>${a.nm}</b> · ${a.act}</p>`).join("")}${f.allyNote?`<p>${f.allyNote}</p>`:""}</div>`; };
const fight = f => `<div class="fight"><div class="top"><h2>${f.name}</h2>
  <div class="run">${f.run.enemy?`<div><b>Enemy right now</b> ${f.run.enemy}</div>`:""}${f.run.matchups?`<div><b>Matchups</b> ${f.run.matchups}</div>`:""}${f.run.beats?`<div class="beats">${f.run.beats.map(b=>`<div>${b}</div>`).join("")}</div>`:""}${f.run.allyJob?`<div><b>Allies</b> ${f.run.allyJob}</div>`:""}<div><b>Win</b> ${f.run.win}</div>${f.run.beats?"":`<div><b>Ends</b> ${f.run.ends}</div>`}<div><b>Losing?</b> ${f.run.losing}</div></div>
  ${f.tally?`<div class="run"><b>${f.tally.label}</b> start at ${f.tally.start}: 1–2 → 9 pieces · 3–4 → 16 · 5+ → 25. Tally: ________</div>`:""}</div>
  ${f.foes.map(foe).join("")}
  ${allyBox(f)}
</div>`;
document.getElementById("pages").innerHTML = DAYS.map(d=>`<div class="page"><div class="sheet">
  <h1>Combat · ${d.head}</h1>
  <p class="sub">Rolls and initiative at the table. Damage is fixed: no damage dice. Write HP in the boxes. 🟡 Draft numbers.</p>
  <div class="cols">${d.keys.map(k=>fight(FIGHTS[k])).join("")}</div>
</div></div>`).join("");
</script>
</body>
</html>
