<!DOCTYPE html>
<!--
  PROP: The DJ poster — DJ Poe Boy's Haunted Bash, 3 AM, Dood Mansion, with Lil Stinky and Angelique.
  ART: Spencer's, used exactly as he made it (assets/spencer-poster.jpg).
  ✅ Signed off as-is (Scott, 2026-11-04 · not in doc). See CANON.md.
  Taped on the locked AIM-room door; it is not handed out.
  PRINT ONLY: print/build.py renders it into print/5-poster.pdf. US Letter, portrait, 100%, plain white paper.
  The art is 10.5 in tall and keeps its own shape (6.56 x 10.5 in), centred on the sheet. No cut.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Poster">
<meta name="theme-color" content="#2a1a3a">
<title>DJ Poe Boy — Haunted Bash</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:#150e1d; color:#e9e2ef;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100dvh; overscroll-behavior:none;
    padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; gap:20px;
  }

  /* -------- screen-only brief -------- */
  .brief{
    width:100%; max-width:640px; background:#22172d; border:1px solid #45325a; border-radius:10px;
    padding:14px 16px; font-size:14px; line-height:1.5;
    -webkit-user-select:none; user-select:none;
  }
  .brief h1{font-size:19px; margin:0 0 6px; color:#fff; font-weight:600}
  .brief p{margin:0 0 8px; color:#cfc3db}
  .brief b{color:#fff}
  .brief button{
    font:inherit; font-weight:600; cursor:pointer; min-height:44px;
    background:#a35bdc; color:#12071c; border:none; border-radius:8px; padding:10px 18px;
  }
  .poster{display:block; width:100%; max-width:480px; height:auto; box-shadow:0 14px 40px rgba(0,0,0,.6)}

  @media print{
    @page{size:letter portrait; margin:0}
    html,body{background:#fff !important}
    body{padding:0; display:flex; align-items:center; justify-content:center; width:8.5in; height:11in; min-height:0}
    .brief{display:none !important}
    .poster{width:auto; max-width:none; height:10.5in; box-shadow:none;
      -webkit-print-color-adjust:exact; print-color-adjust:exact}
  }
</style>
</head>
<body>

  <div class="brief">
    <h1>The DJ poster — print at Staples</h1>
    <p><b>Taped on the locked AIM-room door.</b> Spencer's poster, printed as he made it.</p>
    <p>US Letter, portrait, <b>100% / actual size</b>, colour, plain white paper. No cut.</p>
    <button onclick="window.print()">Print the poster</button>
  </div>

  <img class="poster" src="assets/spencer-poster.jpg" alt="DJ Poe Boy · Haunted Bash · 3 AM · Dood Mansion · Lil Stinky · Angelique">

</body>
</html>
